<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Counting Critters</title>
<meta name="description" content="Count bunnies, ducklings, ladybugs and frogs, pick the right number, fill the carrot basket and collect stickers.">
<style>
:root { --line:#55433f; --ink:#43353f; --sky:#d4f0fb; --paper:#fffaf0; --pink:#ffb9cc; --yellow:#ffe58a; --mint:#aee8cc; --lav:#d6c6ff; --peach:#ffd0a8; --blue:#a9ddff; --grass:#c9eeb0; --focus:#3b6cff; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { display:flex; flex-direction:column; height:100vh; height:100dvh; background:var(--sky); color:var(--ink); font-family:'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
button { font:inherit; color:inherit; touch-action:manipulation; }
[hidden] { display:none !important; }
:focus-visible { outline:4px solid var(--focus); outline-offset:3px; }

/* ---------- top bar ---------- */
.topbar { position:relative; z-index:3; display:flex; align-items:center; gap:8px; padding:6px 10px; min-height:60px; }
.tb { font-size:15px; font-weight:800; min-height:48px; min-width:48px; display:inline-flex; align-items:center; justify-content:center; padding:0 16px; color:var(--ink); background:var(--paper); border:3px solid var(--line); border-radius:999px; box-shadow:0 4px 0 var(--line); cursor:pointer; text-decoration:none; white-space:nowrap; }
.tb:active { transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
.tb-title { flex:1; text-align:center; font-weight:900; font-size:16px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); opacity:.65; }
@media (max-width:560px) { .tb-title { display:none; } .topbar { justify-content:space-between; } }

/* ---------- meadow backdrop (flat colors, no outlines) ---------- */
.scene { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.scene .sun { position:absolute; top:64px; right:4vw; width:clamp(64px,13vmin,120px); animation:spin 90s linear infinite; }
.scene .cloud { position:absolute; width:clamp(90px,20vmin,190px); }
.scene .c1 { top:96px; left:5vw; } .scene .c2 { top:250px; right:1vw; width:clamp(64px,10vmin,120px); }
@media (max-width:560px) { .scene .sun { right:-16px; top:62px; width:70px; } .scene .c1 { left:-20px; } }
.scene .hill { position:absolute; border-radius:50%; }
.scene .h1 { left:-18vw; bottom:-24vh; width:78vw; height:46vh; background:#c3e8ab; }
.scene .h2 { right:-22vw; bottom:-30vh; width:92vw; height:52vh; background:#aee096; }
.scene .grass { position:absolute; left:0; right:0; bottom:0; height:9vh; background:#9ad483; }
.scene .flowers { position:absolute; left:0; bottom:0; width:100%; height:64px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ---------- layout ---------- */
#app { position:relative; z-index:1; flex:1; min-height:0; width:100%; max-width:1000px; margin:0 auto; padding:2px 14px calc(14px + env(safe-area-inset-bottom)); display:flex; }
.screen { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; gap:12px; overflow-y:auto; overflow-x:hidden; padding:6px 4px 10px; }
.card { background:var(--paper); border:3px solid var(--line); border-radius:22px; box-shadow:0 5px 0 var(--line); }
.btn { font-weight:800; font-size:1.1rem; min-height:56px; min-width:56px; padding:.35em 1.3em; border-radius:999px; border:3px solid var(--line); background:var(--yellow); color:var(--ink); box-shadow:0 5px 0 var(--line); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:.5em; }
.btn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 var(--line); }
.btn.go { background:var(--mint); } .btn.help { background:var(--lav); } .btn.ghost { background:#fff; }
.btn:disabled { opacity:.5; cursor:default; }
.row { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; }

/* ---------- title ---------- */
.logo { text-align:center; font-weight:900; line-height:1; font-size:clamp(2.3rem,8.5vw,4rem); letter-spacing:.01em; outline:none; padding-top:4px;
  text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),2px 2px 0 var(--line),-2px 2px 0 var(--line),2px -2px 0 var(--line),-2px -2px 0 var(--line),0 7px 0 var(--line); }
.logo .l1 { color:var(--pink); } .logo .l2 { color:var(--yellow); }
.parade { display:flex; justify-content:center; align-items:flex-end; gap:clamp(4px,2vw,22px); }
.parade .pc { position:relative; width:clamp(54px,14vw,96px); aspect-ratio:1; }
.levelpick { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; padding:10px 14px; }
.lp-label { font-weight:900; font-size:1.05rem; margin-right:4px; }
.lv { font-weight:900; font-size:1.5rem; min-height:56px; min-width:84px; border-radius:999px; border:3px solid var(--line); background:#fff; box-shadow:0 4px 0 var(--line); cursor:pointer; padding:0 14px; }
.lv[aria-pressed="true"] { background:var(--yellow); transform:translateY(2px); box-shadow:0 2px 0 var(--line); }
.acts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.act { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 12px 12px; border:3px solid var(--line); border-radius:26px; box-shadow:0 6px 0 var(--line); cursor:pointer; text-align:center; min-height:200px; }
.act:active { transform:translateY(5px); box-shadow:0 1px 0 var(--line); }
.act .ico { width:92px; height:92px; display:block; flex:none; }
.act .ico svg { width:100%; height:100%; display:block; }
.act b { font-size:1.4rem; line-height:1.1; }
.act small { font-size:.95rem; font-weight:700; opacity:.8; line-height:1.2; }
.act .at { display:flex; flex-direction:column; align-items:center; gap:4px; }
.act .st { display:flex; gap:3px; margin-top:6px; min-height:26px; }
.act .st svg { width:26px; height:26px; }
.a-count { background:var(--pink); } .a-many { background:var(--yellow); } .a-basket { background:var(--mint); }
.album-btn { align-self:center; background:var(--lav); }
@media (max-width:720px) {
  .acts { grid-template-columns:1fr; gap:10px; }
  .act { flex-direction:row; text-align:left; min-height:86px; padding:8px 14px; gap:12px; border-radius:24px; }
  .act .ico { width:62px; height:62px; } .act .at { flex:1; align-items:flex-start; gap:2px; } .act .st { margin-top:3px; min-height:22px; } .act .st svg { width:22px; height:22px; }
  .levelpick { padding:8px 10px; gap:8px; } .lp-label { flex:0 0 100%; text-align:center; margin:0; font-size:.95rem; } .lv { flex:1; min-width:0; min-height:52px; font-size:1.35rem; }
  .act b { font-size:1.2rem; } .act small { font-size:.85rem; }
  .screen { gap:9px; }
}

/* ---------- play ---------- */
.playbar { display:flex; align-items:center; gap:12px; }
.dots { display:flex; gap:6px; margin-left:auto; padding:6px 10px; background:var(--paper); border:3px solid var(--line); border-radius:999px; }
.dots svg { width:26px; height:26px; display:block; }
.dots .d.cur svg { transform:scale(1.18); }
.dots .d.pop svg { animation:pop .5s ease-out 1; }
.prompt { display:flex; align-items:center; gap:12px; padding:10px 12px 10px 18px; outline:none; }
.prompt .txt { flex:1; min-width:0; font-size:clamp(1.15rem,3.6vw,1.65rem); font-weight:900; line-height:1.2; }
.prompt .fb { display:block; margin-top:3px; min-height:1.25em; font-size:.82em; font-weight:800; color:#3d7a3a; }
.hear { flex:none; width:56px; height:56px; border-radius:50%; border:3px solid var(--line); background:var(--blue); box-shadow:0 4px 0 var(--line); display:grid; place-items:center; cursor:pointer; }
.hear:active { transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
.num { flex:none; width:78px; height:78px; border-radius:50%; border:3px solid var(--line); background:var(--yellow); display:grid; place-items:center; font:900 2.5rem Verdana,'Segoe UI',sans-serif; box-shadow:0 4px 0 var(--line); }
.num.bump { animation:pop .4s ease-out 1; }
.modebody { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; }
.fx { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:5; border-radius:26px; }
.field { position:relative; flex:1; min-height:210px; background:var(--grass); border:3px solid var(--line); border-radius:26px; box-shadow:0 5px 0 var(--line); overflow:hidden;
  background-image:radial-gradient(circle at 18px 18px,#dff6c8 5px,transparent 6px); background-size:60px 60px; }
.crit { position:absolute; transform:translate(-50%,-50%); background:none; border:0; padding:0; cursor:pointer; border-radius:50%; }
div.crit { cursor:default; }
.bob { position:absolute; inset:0; display:block; transform-origin:50% 92%; animation:wig 3.4s ease-in-out infinite; animation-delay:var(--d,0s); }
.bob svg { width:100%; height:100%; display:block; overflow:visible; }
.bob.hop { animation:hop .55s ease-out 1; }
.crit.counted .bob svg { filter:saturate(.35) brightness(1.06); opacity:.82; }
.badge { position:absolute; right:-6px; top:-6px; z-index:2; min-width:30px; height:30px; padding:0 6px; border-radius:999px; background:var(--yellow); border:3px solid var(--line); font:900 .95rem Verdana,sans-serif; display:grid; place-items:center; animation:pop .4s ease-out 1; pointer-events:none; }
.controls { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; }
.controls .btn { font-size:1.2rem; }
.btn.next { background:var(--mint); animation:nudge 1.6s ease-in-out infinite; }
.answers { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.ans { min-height:84px; border-radius:24px; border:3px solid var(--line); box-shadow:0 6px 0 var(--line); cursor:pointer; font:900 2.8rem Verdana,'Segoe UI',sans-serif; }
.ans:nth-child(1) { background:var(--peach); } .ans:nth-child(2) { background:var(--blue); } .ans:nth-child(3) { background:var(--lav); }
.ans:active:not(:disabled) { transform:translateY(5px); box-shadow:0 1px 0 var(--line); }
.ans.right { background:var(--mint) !important; } .ans.tried { opacity:.4; } .ans:disabled { cursor:default; }
@media (max-height:700px) { .ans { min-height:70px; font-size:2.3rem; } .num { width:66px; height:66px; font-size:2.1rem; } .field { min-height:170px; } }

/* ---------- carrot basket ---------- */
.bgame { flex:1; min-height:0; display:flex; gap:14px; align-items:stretch; }
.pile { position:relative; flex:4; min-height:120px; border:3px dashed var(--line); border-radius:26px; background:#fff3d6; cursor:pointer; overflow:hidden; padding:0; }
.pile:active:not(:disabled) { background:#ffe9b8; }
.pile:disabled { cursor:default; opacity:.7; }
.pile .cap { position:absolute; left:0; right:0; top:8px; text-align:center; font-weight:900; font-size:.95rem; opacity:.75; pointer-events:none; }
.heap { position:absolute; left:8px; right:8px; top:30px; bottom:6px; }
.heap .hc { position:absolute; width:var(--cs); height:var(--cs); transform:translate(-50%,-50%) rotate(var(--r)); pointer-events:none; }
.heap .hc svg, .bc svg { width:100%; height:100%; display:block; }
.basket { position:relative; flex:6; align-self:flex-start; width:100%; padding:14px 14px 16px; border:3px solid var(--line); border-radius:18px 18px 30px 30px; background-color:#e0a867; background-image:repeating-linear-gradient(45deg,rgba(85,67,63,.14) 0 5px,transparent 5px 12px); box-shadow:0 6px 0 var(--line); }
.basket::before, .basket::after { content:''; position:absolute; top:22px; width:22px; height:46px; border:3px solid var(--line); background:#e0a867; border-radius:14px; }
.basket::before { left:-17px; } .basket::after { right:-17px; }
.basket-in { position:relative; z-index:1; min-height:132px; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:2px; align-content:start; padding:6px; background:#f8e6bf; border:3px solid var(--line); border-radius:12px 12px 22px 22px; }
.bc { position:relative; background:none; border:0; padding:2px; aspect-ratio:1; cursor:pointer; border-radius:12px; min-width:48px; min-height:48px; animation:pop .35s ease-out 1; }
.bc:active { background:rgba(85,67,63,.12); }
.basket-cap { position:absolute; left:50%; bottom:-30px; transform:translateX(-50%); font-weight:900; font-size:.95rem; opacity:.75; white-space:nowrap; }
.basket.shake { animation:shake .5s ease-in-out 1; }
@media (max-width:720px) { .bgame { flex-direction:column; } .pile { flex:none; height:128px; } .basket { flex:none; align-self:stretch; } .basket-in { min-height:104px; } }
@media (max-width:720px) and (max-height:700px) { .pile { height:104px; } .basket { padding:10px 10px 12px; } .basket-in { min-height:100px; } .bc { min-width:48px; min-height:48px; } }

/* ---------- end + album ---------- */
.end { align-items:center; justify-content:center; text-align:center; }
.end h2 { font-size:clamp(1.8rem,6vw,2.6rem); }
.bigstars { display:flex; gap:10px; justify-content:center; }
.bigstars svg { width:clamp(64px,16vw,96px); height:clamp(64px,16vw,96px); }
.bigstars svg.in { animation:pop .6s ease-out both; }
.newsticker { display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:900; font-size:1.2rem; }
.newsticker svg { width:clamp(110px,26vw,150px); height:auto; animation:pop .7s ease-out both; animation-delay:.3s; }
.album h2 { text-align:center; font-size:clamp(1.6rem,5.5vw,2.3rem); outline:none; }
.sgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; max-width:620px; width:100%; margin:0 auto; }
.slot { aspect-ratio:1; display:grid; place-items:center; border:3px dashed #a99a8e; border-radius:50%; color:#a99a8e; font:900 1.3rem Verdana,sans-serif; background:rgba(255,250,240,.6); }
.slot.own { border:0; background:none; }
.slot svg { width:100%; height:100%; display:block; }
.slot.fresh svg { animation:pop .7s ease-out both; }
@media (max-width:480px) { .sgrid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; } }

/* ---------- motion ---------- */
.spark { position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; pointer-events:none; animation:spark 1.05s ease-out forwards; }
.spark svg { width:100%; height:100%; display:block; }
@keyframes spark { 0% { transform:translate(0,0) scale(.2) rotate(0); opacity:0; } 18% { opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg); opacity:0; } }
@keyframes wig { 0%,100% { transform:rotate(-2.4deg); } 50% { transform:rotate(2.4deg); } }
@keyframes hop { 0% { transform:translateY(0) scale(1,1); } 22% { transform:translateY(5%) scale(1.07,.92); } 52% { transform:translateY(-24%) scale(.96,1.07); } 80% { transform:translateY(0) scale(1.05,.95); } 100% { transform:translateY(0) scale(1,1); } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.14); } }
@keyframes pop { 0% { transform:scale(.3); opacity:0; } 60% { transform:scale(1.18); opacity:1; } 100% { transform:scale(1); opacity:1; } }
@keyframes nudge { 0%,100% { transform:translateX(0); } 50% { transform:translateX(5px); } }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
@media (prefers-reduced-motion:reduce) {
  .bob, .scene .sun, .btn.next { animation:none; }
  .bob.hop { animation:pulse .5s ease-out 1; }
  .spark { animation:sparkfade 1.05s ease-out forwards; }
  .basket.shake { animation:pulse .4s ease-out 1; }
  .badge, .bc, .dots .d.pop svg, .bigstars svg.in, .newsticker svg, .slot.fresh svg, .num.bump { animation:none; }
}
@keyframes sparkfade { 0% { opacity:0; } 30% { opacity:1; } 100% { opacity:0; } }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23d4f0fb%22/%3E%3Cellipse cx=%2236%22 cy=%2228%22 rx=%228%22 ry=%2220%22 fill=%22%23fff7ec%22 stroke=%22%2355433f%22 stroke-width=%224%22/%3E%3Cellipse cx=%2264%22 cy=%2228%22 rx=%228%22 ry=%2220%22 fill=%22%23fff7ec%22 stroke=%22%2355433f%22 stroke-width=%224%22/%3E%3Cellipse cx=%2250%22 cy=%2262%22 rx=%2228%22 ry=%2226%22 fill=%22%23fff7ec%22 stroke=%22%2355433f%22 stroke-width=%224%22/%3E%3Ccircle cx=%2240%22 cy=%2258%22 r=%225%22 fill=%22%2355433f%22/%3E%3Ccircle cx=%2260%22 cy=%2258%22 r=%225%22 fill=%22%2355433f%22/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <a class="tb" href="index.html">&larr; Back to the arcade</a>
  <div class="tb-title">Counting Critters</div>
  <button class="tb" id="btnSound" type="button" aria-pressed="true">Sound: On</button>
</header>

<div class="scene" aria-hidden="true">
  <svg class="sun" viewBox="0 0 100 100"><g stroke="#ffe08a" stroke-width="7" stroke-linecap="round"><path d="M50 6v10M50 84v10M6 50h10M84 50h10M19 19l7 7M74 74l7 7M81 19l-7 7M26 74l-7 7"/></g><circle cx="50" cy="50" r="24" fill="#ffe08a"/></svg>
  <svg class="cloud c1" viewBox="0 0 120 60"><g fill="#fff"><circle cx="38" cy="36" r="18"/><circle cx="64" cy="28" r="23"/><circle cx="90" cy="38" r="16"/><rect x="26" y="36" width="76" height="18" rx="9"/></g></svg>
  <svg class="cloud c2" viewBox="0 0 120 60"><g fill="#fff"><circle cx="38" cy="36" r="18"/><circle cx="64" cy="28" r="23"/><circle cx="90" cy="38" r="16"/><rect x="26" y="36" width="76" height="18" rx="9"/></g></svg>
  <div class="hill h1"></div><div class="hill h2"></div><div class="grass"></div>
  <svg class="flowers" preserveAspectRatio="none">
    <defs>
      <g id="petals"><circle cx="0" cy="-7" r="6"/><circle cx="6.7" cy="-2.2" r="6"/><circle cx="4.1" cy="5.7" r="6"/><circle cx="-4.1" cy="5.7" r="6"/><circle cx="-6.7" cy="-2.2" r="6"/><circle r="4.2" fill="#ffd84a"/></g>
      <pattern id="flp" width="260" height="64" patternUnits="userSpaceOnUse">
        <g stroke="#7bbf68" stroke-width="3" stroke-linecap="round"><path d="M34 64V42M104 64V34M172 64V46M226 64V38"/></g>
        <use href="#petals" x="34" y="38" fill="#ff9fbe"/><use href="#petals" x="104" y="30" fill="#fff"/><use href="#petals" x="172" y="42" fill="#c9b3ff"/><use href="#petals" x="226" y="34" fill="#ffb783"/>
      </pattern>
    </defs>
    <rect width="100%" height="64" fill="url(#flp)"/>
  </svg>
</div>

<main id="app">
  <!-- TITLE -->
  <section class="screen" id="scr-title" aria-labelledby="ttl">
    <h1 class="logo" id="ttl" tabindex="-1" data-focus><span class="l1">Counting</span> <span class="l2">Critters</span></h1>
    <div class="parade" id="parade" aria-hidden="true"></div>
    <div class="card levelpick" role="group" aria-label="How high do you want to count?">
      <span class="lp-label">Count up to</span>
      <button class="lv" type="button" data-level="5" aria-pressed="false">1-5</button>
      <button class="lv" type="button" data-level="10" aria-pressed="true">1-10</button>
      <button class="lv" type="button" data-level="20" aria-pressed="false">1-20</button>
    </div>
    <div class="acts">
      <button class="act a-count" type="button" data-mode="count"><span class="ico" data-ico="count"></span><span class="at"><b>Count Along</b><small>Tap each critter and count with me</small><span class="st" data-st="count"></span></span></button>
      <button class="act a-many" type="button" data-mode="many"><span class="ico" data-ico="many"></span><span class="at"><b>How Many?</b><small>Look, then pick the right number</small><span class="st" data-st="many"></span></span></button>
      <button class="act a-basket" type="button" data-mode="basket"><span class="ico" data-ico="basket"></span><span class="at"><b>Fill the Basket</b><small>Put just the right carrots in</small><span class="st" data-st="basket"></span></span></button>
    </div>
    <button class="btn album-btn" id="btnAlbum" type="button">My stickers <span id="albumCount">0/12</span></button>
  </section>

  <!-- PLAY -->
  <section class="screen" id="scr-play" aria-label="Activity" hidden>
    <div class="playbar">
      <button class="btn ghost" id="btnHome" type="button">&larr; Home</button>
      <div class="dots" id="dots" role="img" aria-label="Round progress"></div>
    </div>
    <div class="card prompt" id="prompt" tabindex="-1">
      <div class="txt"><span id="promptText"></span><span class="fb" id="fb" role="status" aria-live="polite"></span></div>
      <button class="hear" id="btnHear" type="button" aria-label="Hear it again"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#43353f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#43353f"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <div class="num" id="num" aria-hidden="true">0</div>
    </div>
    <div class="modebody" id="modeBody"></div>
  </section>

  <!-- END OF ROUND -->
  <section class="screen end" id="scr-end" aria-labelledby="endTitle" hidden>

  window.__counting = {

    startLevel: n => startRound('count', n), solve: answerCorrect, answer: ok => (ok ? answerCorrect() : answerWrong()),
  };
}

refreshTitle(); show('title');
})();
</script>
