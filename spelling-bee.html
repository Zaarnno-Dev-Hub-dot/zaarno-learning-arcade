// ---- SAVED PROGRESS ----
// spellingBee.v1 = { best: { 'mode-difficulty': score }, bestOverall, stats: { games, words, correct }, settings: { mode, difficulty, sound } }
const SAVE_KEY='spellingBee.v1';
function loadSave(){
 let s=null;
 try{s=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
 if(!s||typeof s!=='object')s={};
 s.best=(s.best&&typeof s.best==='object')?s.best:{};
 s.stats=Object.assign({games:0,words:0,correct:0},s.stats);
 s.settings=Object.assign({mode:0,difficulty:0,sound:true},s.settings);
 let legacy=0;
 try{legacy=parseInt(localStorage.getItem('sb_highScore'))||0;}catch(e){}
 s.bestOverall=Math.max(Number(s.bestOverall)||0,legacy);
 return s;
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const save=loadSave();
let soundOn=save.settings.sound!==false;

// ---- AUDIO ----
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function playTone(f,d,t,v){if(!soundOn)return;try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v||0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function playCorrect(){playTone(523,0.12,'sine',0.25);setTimeout(()=>playTone(659,0.12,'sine',0.25),100);setTimeout(()=>playTone(784,0.18,'sine',0.25),200);}
function playIncorrect(){playTone(200,0.3,'sawtooth',0.2);}
function playGameOver(){playTone(300,0.3,'sawtooth',0.25);setTimeout(()=>playTone(220,0.4,'sawtooth',0.25),300);setTimeout(()=>playTone(150,0.6,'sawtooth',0.2),600);}
function playHint(){playTone(880,0.1,'triangle',0.15);}
function playKey(){playTone(440,0.04,'square',0.05);}
function toggleSound(){soundOn=!soundOn;save.settings.sound=soundOn;persist();if(soundOn)playTone(660,0.1,'sine',0.2);else stopSpeaking();}

// Spoken words use the browser's built-in voice (no network). Not every device has one.
const canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function stopSpeaking(){try{if(canSpeak)window.speechSynthesis.cancel();}catch(e){}}
function speakWord(word){
 if(!canSpeak)return false;
 try{
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.rate=0.8;u.lang='en-US';
  window.speechSynthesis.speak(u);
  return true;
 }catch(e){return false;}
}

// ---- INPUT ----
const keys={},mouse={x:0,y:0,clicked:false};
let touchUI=false;
try{touchUI=window.matchMedia('(pointer: coarse)').matches;}catch(e){}
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 // While playing, letters are typing and never shortcuts (P and H used to pause and hint by mistake).
 if(state==='playing'&&!paused&&handlePlayKey(e)){e.preventDefault();return;}
 if(!keys[e.key]||keys[e.key]===0)keys[e.key]=2;
 e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=0;});
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(e.pointerType==='touch')touchUI=true;
 const r=canvas.getBoundingClientRect();
 mouse.x=(e.clientX-r.left)*(W/r.width);mouse.y=(e.clientY-r.top)*(H/r.height);
 mouse.clicked=true;initAudio();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){paused=true;stopSpeaking();}});
function justPressed(k){return keys[k]===2;}

// Buttons are rebuilt every frame while drawing, so clicks always match what is on screen.
let uiButtons=[];
function drawButton(label,x,y,w,h,fn,o){
 o=o||{};
 uiButtons.push({x,y,w,h,fn});
 ctx.fillStyle=o.fill||'rgba(61,43,31,0.85)';
 ctx.strokeStyle=o.stroke||'#c7950e';ctx.lineWidth=2;
 ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();
 ctx.fillStyle=o.color||'#ffd700';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font=o.font||'bold 20px sans-serif';
 ctx.fillText(label,x+w/2,y+h/2+1);
 ctx.textBaseline='alphabetic';
}
function handleButtonClick(){
 if(!mouse.clicked)return false;
 for(let i=uiButtons.length-1;i>=0;i--){
  const b=uiButtons[i];
  if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h){mouse.clicked=false;b.fn();return true;}
 }
 return false;
}

// Build full tier lookup
const allTiers={1:wordBank.tier1,2:wordBank.tier2,3:wordBank.tier3,4:wordBank.tier4};

// Easy = tier 1, Medium = tiers 1-2, and so on. A word that appears twice in the bank is only used once.
function getWordsForTier(name){
 const t={easy:1,medium:2,hard:3,expert:4}[name]||1;
 const seen=new Set(),words=[];
 for(let i=1;i<=t;i++)for(const e of allTiers[i]){if(!seen.has(e.word)){seen.add(e.word);words.push(e);}}
 return words;
}

const modeNames=['See & Spell','Hear & Spell','Definition Clues','Speed Spell','Jumble Rescue'];

const diffNames=['Easy','Medium','Hard','Expert'];
if(!(mode>=0&&mode<5))mode=0;

// ---- PARTICLES ----
let particles=[];
function spawnConfetti(x,y,count){
 const colors=['#ffd700','#7cb342','#66bb6a','#ef5350','#ffcc00','#ff8800'];
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2,s=Math.random()*200+50;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:1,decay:0.008+Math.random()*0.015,size:3+Math.random()*5,color:colors[Math.floor(Math.random()*colors.length)]});
 }
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;
  p.life-=p.decay;if(p.life<=0)particles.splice(i,1);
 }
}
function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(p.life,0);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
 }
 ctx.globalAlpha=1;
}

// ---- HELPERS ----
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function startGame(){
 const words=getWordsForTier(diffNames[diffIdx].toLowerCase());
 wordQueue=shuffleArray([...words]);
 wordIdx=0;
 score=0;lives=3;streak=0;maxStreak=0;totalWords=0;correctWords=0;newBest=false;
 inputBuffer='';hintUsed=false;flashTimer=0;paused=false;reveal=null;particles=[];
 speedTimeLeft=60;
 modeBest=save.best[mode+'-'+diffIdx]||0;
 save.settings.mode=mode;save.settings.difficulty=diffIdx;persist();
 state='playing';
 loadNextWord();
}

function loadNextWord(){
 if(wordIdx>=wordQueue.length){
  wordQueue=shuffleArray([...wordQueue]);
  wordIdx=0;
 }
 currentEntry=wordQueue[wordIdx++];
 currentWord=currentEntry.word;
 inputBuffer='';hintUsed=false;showWordPhase=false;showWordTimer=2;
 if(mode===4){
  // never show the word already in order
  let tries=0;
  do{jumbleLetters=shuffleArray(currentWord.split(''));tries++;}while(jumbleLetters.join('')===currentWord&&tries<10);
 }
 if(mode===0){showWordPhase=true;showWordTimer=3;}
 if(mode===1&&soundOn)speakWord(currentWord);
}

function useHint(){
 if(!hintUsed&&currentWord&&!reveal){hintUsed=true;playHint();}
}
function typeChar(c){
 if(reveal||(mode===0&&showWordPhase))return;
 if(inputBuffer.length<30){inputBuffer+=c.toLowerCase();playKey();}
}
function backspace(){if(!reveal)inputBuffer=inputBuffer.slice(0,-1);}
function submitGuess(){if(!reveal&&inputBuffer.trim()!=='')checkSpelling();}

function handlePlayKey(e){
 const k=e.key;
 if(k==='Escape'){paused=true;stopSpeaking();return true;}
 if(reveal){if(k==='Enter'||k===' ')finishReveal();return true;}
 if(k==='Tab'){useHint();return true;}
 if(k==='Enter'){submitGuess();return true;}
 if(k==='Backspace'){backspace();return true;}
 if(k===' ')return true;
 if(k.length===1&&/[a-zA-Z']/.test(k)){typeChar(k);return true;}
 return false;
}

function endGame(){
 state='gameover';
 stopSpeaking();
 gameOverStats={score,correctWords,totalWords,accuracy:totalWords>0?Math.round(correctWords/totalWords*100):0,maxStreak};
 const key=mode+'-'+diffIdx;
 newBest=score>0&&score>(save.best[key]||0);
 if(newBest)save.best[key]=score;
 modeBest=save.best[key]||0;
 if(score>save.bestOverall)save.bestOverall=score;
 highScore=save.bestOverall;
 save.stats.games++;save.stats.words+=totalWords;save.stats.correct+=correctWords;
 persist();
 playGameOver();
}

function finishReveal(){
 const over=reveal&&reveal.over;
 reveal=null;
 if(over)endGame();else loadNextWord();
}

function checkSpelling(){
 const guess=inputBuffer.trim().toLowerCase();
 const isCorrect=guess===currentWord.toLowerCase();
 totalWords++;
 if(isCorrect){
  streak++;correctWords++;
  if(streak>maxStreak)maxStreak=streak;
  let pts=Math.round(100*(currentWord.length/3)*Math.min(streak,10));
  if(hintUsed)pts=Math.round(pts/2);
  if(mode===3)pts+=Math.round(speedTimeLeft*50);
  score+=pts;
  flashTimer=0.4;flashColor='#66bb6a';
  spawnConfetti(W/2,250,30);
  playCorrect();
  loadNextWord();
 }else{
  streak=0;lives--;
  flashTimer=0.4;flashColor='#ef5350';
  playIncorrect();
  stopSpeaking();
  reveal={word:currentWord,typed:guess,timer:3,over:lives<=0};
 }
}

function drawHexBackground(){
 ctx.fillStyle='#ffd700';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#c7950e';ctx.lineWidth=1;
 const hexSize=40;
 for(let row=-1;row<Math.ceil(H/hexSize/1.5)+2;row++){
  for(let col=-1;col<Math.ceil(W/hexSize/1.8)+2;col++){
   const x=col*hexSize*1.8+(row%2)*hexSize*0.9;
   const y=row*hexSize*1.5;
   ctx.beginPath();
   for(let i=0;i<6;i++){
    const angle=Math.PI/3*i-Math.PI/6;
    const px=x+hexSize*Math.cos(angle);
    const py=y+hexSize*Math.sin(angle);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }
   ctx.closePath();ctx.stroke();
  }
 }
}

 ctx.fillText('High Score: '+highScore,W/2,288);
 ctx.fillStyle='#ccc';
 ctx.fillText('Words correct: '+gameOverStats.correctWords+' / '+gameOverStats.totalWords,W/2,335);
 ctx.fillText('Accuracy: '+gameOverStats.accuracy+'%',W/2,368);
 ctx.fillText('Best streak: '+gameOverStats.maxStreak+'x',W/2,401);
 drawButton('Back to menu',W/2-130,450,260,52,()=>{state='title';},{font:'bold 24px sans-serif',color:'#ffffff',fill:'#7cb342',stroke:'#4d7c0f'});
 ctx.font='16px sans-serif';ctx.fillStyle='#ffd700';
 ctx.fillText('or press Enter',W/2,532);
}

function drawPaused(){
 ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';ctx.font='bold 48px sans-serif';ctx.fillStyle='#ffd700';
 ctx.fillText('PAUSED',W/2,H/2-50);
 drawButton('Resume',W/2-100,H/2-20,200,50,()=>{paused=false;},{font:'bold 24px sans-serif'});
 ctx.font='18px sans-serif';ctx.fillStyle='#ffffff';
 ctx.fillText('or press Esc',W/2,H/2+70);
}

// ---- STEPS ----
function updatePlaying(dt){
 if(flashTimer>0)flashTimer-=dt;
 if(speechNote>0)speechNote-=dt;
 updateParticles(dt);
 if(reveal){
  reveal.timer-=dt;
  if(reveal.timer<=0)finishReveal();
  return;
 }
 if(mode===0&&showWordPhase){
  showWordTimer-=dt;
  if(showWordTimer<=0)showWordPhase=false;
 }
 if(mode===3){
  speedTimeLeft-=dt;
  if(speedTimeLeft<=0)endGame();
 }
}

function stepTitle(){
 drawTitle();
 if(handleButtonClick())return;
 if(justPressed('ArrowUp')||justPressed('w')||justPressed('W')){mode=(mode+4)%5;}
 if(justPressed('ArrowDown')||justPressed('s')||justPressed('S')){mode=(mode+1)%5;}
 if(justPressed('d')||justPressed('D')){diffIdx=(diffIdx+1)%4;}
 if(justPressed('Enter')||justPressed(' ')){initAudio();startGame();}
}

function drawPauseAndSound(){
 drawButton('❚❚',W-124,H-60,56,50,()=>{paused=true;stopSpeaking();},{font:'bold 16px sans-serif',fill:'rgba(255,255,255,0.55)',stroke:'#8d6e40',color:'#3d2b1f'});
 drawSoundButton(W-62,H-60);
}

function stepPlaying(dt){
 if(paused){
  drawGame();
  drawPaused();
  drawSoundButton(W-62,H-60);
  if(handleButtonClick())return;
  if(justPressed('Escape')||justPressed('p')||justPressed('P')||justPressed('Enter'))paused=false;
  return;
 }
 updatePlaying(dt);
 if(state!=='playing')return;
 drawGame();
 drawPauseAndSound();
 if(!handleButtonClick()&&mouse.clicked&&reveal){mouse.clicked=false;finishReveal();}
}

function stepGameOver(dt){
 updateParticles(dt);
 drawGame();
 drawGameOver();
 if(handleButtonClick())return;
 if(justPressed('Enter')||justPressed(' '))state='title';
}

// ---- MAIN LOOP ----
let lastTime=0;
function gameLoop(timestamp){
 const dt=Math.min((timestamp-lastTime)/1000,0.05);
 lastTime=timestamp;
 uiButtons=[];
 ctx.clearRect(0,0,W,H);
 if(state==='title')stepTitle();
 else if(state==='playing')stepPlaying(dt);
 else if(state==='gameover')stepGameOver(dt);
 for(const k in keys)if(keys[k]===2)keys[k]=1;
 mouse.clicked=false;
 requestAnimationFrame(gameLoop);
}

// Polyfill roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
 CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
  if(r>w/2)r=w/2;if(r>h/2)r=h/2;
  this.moveTo(x+r,y);
  this.arcTo(x+w,y,x+w,y+h,r);
  this.arcTo(x+w,y+h,x,y+h,r);
  this.arcTo(x,y+h,x,y,r);
  this.arcTo(x,y,x+w,y,r);
  return this;
 };
}

// Handle resize
function resizeCanvas(){
 const container=document.getElementById('gameContainer');
 const scale=Math.min(container.clientWidth/W,container.clientHeight/H);
 canvas.style.width=(W*scale)+'px';canvas.style.height=(H*scale)+'px';
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// Test hook: spelling-bee.html?debug
if(/[?&]debug\b/.test(location.search)){
 window.__sb={
  startGame,save,persist,getWordsForTier,checkSpelling,
  get state(){return state;},get word(){return currentWord;},get score(){return score;},get lives(){return lives;},
  get input(){return inputBuffer;},get reveal(){return reveal;},get paused(){return paused;},get hintUsed(){return hintUsed;},
  get soundOn(){return soundOn;},get streak(){return streak;},get showing(){return showWordPhase;},get touchUI(){return touchUI;},
  setMode(m,d){mode=m;diffIdx=d;},setTime(t){speedTimeLeft=t;}
 };
}

requestAnimationFrame(gameLoop);
})();
</script>
