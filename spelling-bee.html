// Build full tier lookup
const allTiers={1:wordBank.tier1,2:wordBank.tier2,3:wordBank.tier3,4:wordBank.tier4};

function getWordsForTier(tier){
 // tier: 'easy'=>1, 'medium'=>2, 'hard'=>3, 'expert'=>4
 const t={easy:1,medium:2,hard:3,expert:4}[tier]||1;
 // Return merged tiers up to this level
 let words=[];
 for(let i=1;i<=t;i++)words=words.concat(allTiers[i]);
 return words;
}

// ---- GAME STATE ----
let state='title';
let score=0,highScore=parseInt(localStorage.getItem('sb_highScore'))||0;
let lives=3,streak=0,maxStreak=0,totalWords=0,correctWords=0;
let mode=0; // 0=see-spell,1=hear-spell,2=def-clues,3=speed-spell,4=jumble
const modeNames=['See & Spell','Hear & Spell','Definition Clues','Speed Spell','Jumble Rescue'];
let diffIdx=0;
const diffNames=['Easy','Medium','Hard','Expert'];
let currentWord=null,currentEntry=null,inputBuffer='',hintUsed=false;
let wordQueue=[],wordIdx=0;
let flashTimer=0,flashColor='';
let speedTimer=0,speedTimeLeft=60;
let jumbleLetters=[];
let showWordTimer=0;
let showWordPhase=false;
let paused=false;
let gameOverStats={};

// ---- PARTICLES ----
let particles=[];
function spawnConfetti(x,y,count){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2,s=Math.random()*200+50;
  const colors=['#ffd700','#7cb342','#66bb6a','#ef5350','#ffcc00','#ff8800'];
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:1,decay:0.008+Math.random()*0.015,size:3+Math.random()*5,color:colors[Math.floor(Math.random()*colors.length)]});
 }
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;
  p.life-=p.decay;if(p.life<=0)particles.splice(i,1);
 }
}

// ---- HELPERS ----
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function prepareGame(){
 const words=getWordsForTier(diffNames[diffIdx].toLowerCase());
 wordQueue=shuffleArray([...words]);
 wordIdx=0;
 score=0;lives=3;streak=0;maxStreak=0;totalWords=0;correctWords=0;
 inputBuffer='';hintUsed=false;flashTimer=0;
 speedTimeLeft=60;speedTimer=0;
 loadNextWord();
}

function loadNextWord(){
 if(wordIdx>=wordQueue.length){
  wordQueue=shuffleArray([...wordQueue]);
  wordIdx=0;
 }
 currentEntry=wordQueue[wordIdx++];
 currentWord=currentEntry.word;
 inputBuffer='';hintUsed=false;showWordPhase=false;showWordTimer=2;
 if(mode===4){
  jumbleLetters=shuffleArray(currentWord.split(''));
 }
 if(mode===0){
  showWordPhase=true;showWordTimer=3;
 }
}

function checkSpelling(){
 const guess=inputBuffer.trim().toLowerCase();
 const correct=currentWord.toLowerCase();
 const isCorrect=guess===correct;
 totalWords++;

 if(isCorrect){
  streak++;correctWords++;
  if(streak>maxStreak)maxStreak=streak;
  const mult=Math.min(streak,10);
  let pts=Math.round(100*(currentWord.length/3)*mult);
  if(hintUsed)pts=Math.round(pts/2);
  if(mode===3)pts+=Math.round(speedTimeLeft*50);
  score+=pts;
  flashTimer=0.4;flashColor='#66bb6a';
  spawnConfetti(W/2,250,30);
  playCorrect();
 }else{
  streak=0;lives--;
  flashTimer=0.4;flashColor='#ef5350';
  playIncorrect();
  if(lives<=0){
   state='gameover';
   gameOverStats={score,correctWords,totalWords,accuracy:totalWords>0?Math.round(correctWords/totalWords*100):0,maxStreak};
   if(score>highScore){highScore=score;localStorage.setItem('sb_highScore',highScore);}
   playGameOver();
   return;
  }
 }
 loadNextWord();
}

// ---- RENDER ----
function drawHexBackground(){
 ctx.fillStyle='#ffd700';ctx.fillRect(0,0,W,H);
 // Draw honeycomb pattern
 ctx.strokeStyle='#c7950e';ctx.lineWidth=1;
 const hexSize=40;
 for(let row=-1;row<Math.ceil(H/hexSize/1.5)+2;row++){
  for(let col=-1;col<Math.ceil(W/hexSize/1.8)+2;col++){
   const x=col*hexSize*1.8+(row%2)*hexSize*0.9;
   const y=row*hexSize*1.5;
   ctx.beginPath();
   for(let i=0;i<6;i++){
    const angle=Math.PI/3*i-Math.PI/6;
    const px=x+hexSize*Math.cos(angle);
    const py=y+hexSize*Math.sin(angle);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }
   ctx.closePath();ctx.stroke();
  }
 }
}

function drawTitle(){
 drawHexBackground();

 ctx.textAlign='center';
 ctx.shadowColor='#3d2b1f';ctx.shadowBlur=15;
 ctx.font='bold 64px sans-serif';
 ctx.fillStyle='#3d2b1f';
 ctx.fillText('Spelling Bee',W/2,150);
 ctx.shadowBlur=0;

 // Bee icon
 ctx.font='48px sans-serif';
 ctx.fillText('🐝',W/2,210);

 ctx.font='18px sans-serif';ctx.fillStyle='#3d2b1f';
 ctx.fillText('Master your spelling skills!',W/2,250);

 // Modes
 for(let i=0;i<5;i++){
  const y=285+i*38;
  ctx.font='20px sans-serif';
  ctx.fillStyle=i===mode?'#7cb342':'#5c4033';
  ctx.fillText((i===mode?'✦ ':'  ')+modeNames[i],W/2-200,y);
 }

 // Difficulty
 ctx.font='18px sans-serif';ctx.fillStyle='#3d2b1f';
 ctx.fillText('Difficulty:',W/2-200,500);
 for(let i=0;i<4;i++){
  ctx.fillStyle=i===diffIdx?'#c7950e':'#8d6e40';
  ctx.fillText((i===diffIdx?'[ ':'  ')+diffNames[i]+(i===diffIdx?' ]':''),W/2-100+i*120,500);
 }

 ctx.font='16px sans-serif';ctx.fillStyle='#5c4033';
 ctx.fillText('↑↓: mode  |  D: difficulty  |  Enter: start  |  H: hint  |  Esc: pause',W/2,560);
 ctx.fillStyle='#c7950e';
 ctx.font='18px sans-serif';
 ctx.fillText('High Score: '+highScore,W/2,50);
}

function drawGame(){
 drawHexBackground();

 // Flash overlay
 if(flashTimer>0){
  ctx.fillStyle=flashColor+'44';
  ctx.fillRect(0,0,W,H);
 }

 // Clue area
 ctx.fillStyle='rgba(61,43,31,0.9)';
 ctx.fillRect(120,50,720,140);
 ctx.strokeStyle='#c7950e';ctx.lineWidth=3;
 ctx.strokeRect(120,50,720,140);

 ctx.textAlign='center';

 // Mode-specific display
 if(mode===0){ // See & Spell
  if(showWordPhase&&showWordTimer>0){
   ctx.font='bold 48px sans-serif';
   ctx.fillStyle='#ffd700';
   ctx.fillText(currentWord.toUpperCase(),W/2,150);
   ctx.font='18px sans-serif';
   ctx.fillStyle='#aaa';
   ctx.fillText('Memorize this word!',W/2,175);
  }else{
   ctx.font='22px sans-serif';
   ctx.fillStyle='#ffd700';
   ctx.fillText('Type the word you saw:',W/2,110);
   ctx.font='16px sans-serif';
   ctx.fillStyle='#ccc';
   ctx.fillText('(It was shown for 3 seconds)',W/2,145);
  }
 }else if(mode===1){ // Hear & Spell
  ctx.font='22px sans-serif';
  ctx.fillStyle='#ffd700';
  ctx.fillText('Spell this word:',W/2,110);
  ctx.font='16px sans-serif';
  ctx.fillStyle='#ccc';
  ctx.fillText('Hint: '+currentWord.split('').map((l,i)=>i===0?l:'_').join(' '),W/2,145);
 }else if(mode===2){ // Definition Clues
  ctx.font='20px sans-serif';
  ctx.fillStyle='#ffd700';
  ctx.fillText('What word matches this definition?',W/2,85);
  ctx.font='bold 24px sans-serif';
  ctx.fillStyle='#ffffff';
  ctx.fillText(currentEntry.hint,W/2,130);
 }else if(mode===3){ // Speed Spell
  ctx.font='22px sans-serif';
  ctx.fillStyle='#ffd700';
  ctx.fillText('Spell the word!  Time: '+Math.ceil(speedTimeLeft)+'s',W/2,85);
  ctx.font='20px sans-serif';
  ctx.fillStyle='#ccc';
  ctx.fillText('Definition: '+currentEntry.hint,W/2,130);
 }else if(mode===4){ // Jumble Rescue
  ctx.font='22px sans-serif';
  ctx.fillStyle='#ffd700';
  ctx.fillText('Unscramble these letters:',W/2,85);
  ctx.font='bold 36px sans-serif';
  ctx.fillStyle='#ffffff';
  ctx.fillText(jumbleLetters.join('  '),W/2,130);
 }

 // Input field
 ctx.fillStyle='rgba(0,0,0,0.4)';
 ctx.fillRect(230,220,500,50);
 ctx.strokeStyle='#c7950e';ctx.lineWidth=2;
 ctx.strokeRect(230,220,500,50);

 ctx.textAlign='center';
 ctx.font='bold 28px sans-serif';
 ctx.fillStyle='#ffffff';
 const cursor=Math.floor(Date.now()/500)%2?'|':'';
 ctx.fillText(inputBuffer+cursor,W/2,255);

 // HUD
 ctx.textAlign='left';
 ctx.font='bold 20px "Courier New",Courier,monospace';
 ctx.fillStyle='#3d2b1f';
 ctx.fillText('Score: '+score,20,30);
 ctx.textAlign='right';
 ctx.fillStyle='#ef5350';
 let hearts='';
 for(let i=0;i<lives;i++)hearts+='♥ ';
 ctx.fillText(hearts,W-20,30);
 ctx.textAlign='left';
 ctx.fillStyle='#7cb342';
 ctx.font='18px sans-serif';
 ctx.fillText('Streak: '+streak+'x  |  Words: '+totalWords+'  |  H: Hint',20,55);

 if(hintUsed){
  ctx.fillStyle='#c7950e';
  ctx.fillText('Hint used — points halved!',20,78);
 }

 // Hint display
 if(hintUsed&&currentWord){
  ctx.fillStyle='#ffd700';
  ctx.font='18px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('First letter: '+currentWord[0].toUpperCase(),W/2,290);
 }
}

function drawGameOver(){
 ctx.fillStyle='rgba(61,43,31,0.9)';ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';
 ctx.shadowColor='#ef5350';ctx.shadowBlur=20;
 ctx.font='bold 56px sans-serif';
 ctx.fillStyle='#ef5350';
 ctx.fillText('Game Over',W/2,160);
 ctx.shadowBlur=0;

 ctx.font='28px sans-serif';ctx.fillStyle='#ffd700';
 ctx.fillText('Score: '+score,W/2,230);
 ctx.fillStyle='#ffffff';
 ctx.fillText('High Score: '+highScore,W/2,270);

 ctx.font='20px sans-serif';ctx.fillStyle='#ccc';
 ctx.fillText('Words Correct: '+gameOverStats.correctWords+' / '+gameOverStats.totalWords,W/2,320);
 ctx.fillText('Accuracy: '+gameOverStats.accuracy+'%',W/2,350);
 ctx.fillText('Best Streak: '+gameOverStats.maxStreak+'x',W/2,380);

 ctx.font='22px sans-serif';ctx.fillStyle='#7cb342';
 ctx.fillText('Press Enter to Play Again',W/2,470);
}

function drawPaused(){
 ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';
 ctx.font='bold 48px sans-serif';
 ctx.fillStyle='#ffd700';
 ctx.fillText('PAUSED',W/2,H/2-20);
 ctx.font='20px sans-serif';
 ctx.fillStyle='#ffffff';
 ctx.fillText('Press Esc or P to resume',W/2,H/2+30);
}

// ---- UPDATE ----
function updatePlaying(dt){
 if(flashTimer>0)flashTimer-=dt;
 updateParticles(dt);

 // Show word timer for See & Spell
 if(mode===0&&showWordPhase){
  showWordTimer-=dt;
  if(showWordTimer<=0)showWordPhase=false;
 }

 // Speed Spell timer
 if(mode===3){
  speedTimeLeft-=dt;
  if(speedTimeLeft<=0){
   state='gameover';
   gameOverStats={score,correctWords,totalWords,accuracy:totalWords>0?Math.round(correctWords/totalWords*100):0,maxStreak};
   if(score>highScore){highScore=score;localStorage.setItem('sb_highScore',highScore);}
   playGameOver();
  }
 }
}

// ---- MAIN LOOP ----
let lastTime=0;

function gameLoop(timestamp){
 const dt=Math.min((timestamp-lastTime)/1000,0.05);
 lastTime=timestamp;

 ctx.clearRect(0,0,W,H);

 if(state==='title'){
  drawTitle();
  if(justPressed('ArrowUp')||justPressed('w')||justPressed('W')){mode=(mode-1+5)%5;}
  if(justPressed('ArrowDown')||justPressed('s')||justPressed('S')){mode=(mode+1)%5;}
  if(justPressed('d')||justPressed('D')){diffIdx=(diffIdx+1)%4;}
  if(justPressed('Enter')||justPressed(' ')){state='playing';prepareGame();initAudio();}
  if(mouse.clicked){
   const my=mouse.y;
   if(my>=270&&my<460){
    const idx=Math.floor((my-270)/38);
    if(idx>=0&&idx<5)mode=idx;
   }
   if(my>=485&&my<515){
    const idx=Math.floor((mouse.x-(W/2-100))/120);
    if(idx>=0&&idx<4)diffIdx=idx;
   }
   if(my>=540&&my<580){state='playing';prepareGame();initAudio();}
   mouse.clicked=false;
  }
  for(const k in keys)if(keys[k]===2)keys[k]=1;
  requestAnimationFrame(gameLoop);return;
 }

 if(state==='playing'||state==='paused'){
  if(paused||justPressed('Escape')||justPressed('p')||justPressed('P')){
   paused=!paused;
  }
  if(paused){
   drawGame();
   drawPaused();
   for(const k in keys)if(keys[k]===2)keys[k]=1;
   requestAnimationFrame(gameLoop);return;
  }

  updatePlaying(dt);
  drawGame();

  // Input
  // Letter keys
  for(let c=65;c<=90;c++){
   const letter=String.fromCharCode(c);
   if(justPressed(letter)||justPressed(letter.toLowerCase())){
    if(inputBuffer.length<30){
     inputBuffer+=letter;
    }
   }
  }
  // Space for the letter "Space" in words... but mostly we just handle letters
  // Actually let's handle spaces for compound words
  if(justPressed(' ')){
   if(inputBuffer.length<30&&mode!==3)inputBuffer+=' ';
  }
  // Apostrophe
  if(justPressed("'")||justPressed("'")){
   if(inputBuffer.length<30)inputBuffer+="'";
  }
  // Backspace
  if(justPressed('Backspace')){
   inputBuffer=inputBuffer.slice(0,-1);
  }
  // Hint
  if(justPressed('h')||justPressed('H')){
   if(!hintUsed&&currentWord){
    hintUsed=true;
    playHint();
   }
  }
  // Submit
  if(justPressed('Enter')){
   if(inputBuffer.trim()!==''){
    checkSpelling();
   }
  }

  // Render particles
  for(const p of particles){
   ctx.globalAlpha=p.life;
   ctx.fillStyle=p.color;
   ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
 }

 if(state==='gameover'){
  drawGameOver();
  // Particles continue
  updateParticles(dt);
  for(const p of particles){
   ctx.globalAlpha=p.life;
   ctx.fillStyle=p.color;
   ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  if(justPressed('Enter')||justPressed(' ')){state='title';}
  if(mouse.clicked&&mouse.y>440&&mouse.y<510){state='title';mouse.clicked=false;}
 }

 for(const k in keys)if(keys[k]===2)keys[k]=1;
 if(mouse.clicked)mouse.clicked=false;

 requestAnimationFrame(gameLoop);
}

// Handle resize
function resizeCanvas(){
 const container=document.getElementById('gameContainer');
 const scale=Math.min(container.clientWidth/W,container.clientHeight/H);
 canvas.style.width=(W*scale)+'px';canvas.style.height=(H*scale)+'px';
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

requestAnimationFrame(gameLoop);
})();
