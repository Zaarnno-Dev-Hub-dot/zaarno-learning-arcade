<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Letter Lagoon</title>
<meta name="description" content="A gentle underwater letter game for ages 3 to 6: pop letter bubbles, match big and little letters, and find first sounds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%234db6dd%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2232%22 fill=%22%23fff%22 stroke=%22%23143d5c%22 stroke-width=%226%22/%3E%3Ctext x=%2250%22 y=%2262%22 font-size=%2240%22 font-family=%22Verdana%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23143d5c%22%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#143d5c; --ink2:#2d6f99; --paper:#fffdf6;
  --gold:#ffc83d; --gold-d:#c98a00; --coral:#ff7a6b; --coral-d:#c24a3d;
  --teal:#27c2b0; --teal-d:#137a70; --lilac:#b58cf0; --green:#35b872;
  --shadow:rgba(20,61,92,.38);
  --font:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --glyph:Verdana,'DejaVu Sans','Segoe UI',sans-serif;
  --emoji:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#4db6dd;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;touch-action:manipulation}
.hidden{display:none!important}
.ol{stroke:var(--ink);stroke-width:3px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ol3{stroke:var(--ink);stroke-width:1.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ol2{stroke:var(--ink);stroke-width:2px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;fill:none}
.gl{font-family:var(--glyph);font-weight:700;fill:var(--ink)}
.st .ol{stroke-width:2px}
/* underwater scene (static flat shapes) */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#scene>svg{position:absolute;display:block}
#sea{left:0;top:0;width:100%;height:100%}
#floor{left:0;bottom:0;width:100%;height:19%}
.plant{bottom:0;height:34%;width:auto;max-width:34%}
#plantL{left:0}
#plantR{right:0;transform:scaleX(-1)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.sway.s2{animation-duration:6.5s;animation-delay:-2s}
.sway.s3{animation-duration:4.2s;animation-delay:-1s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
/* top bar */
.topbar{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:56px}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:var(--ink);font-size:15px;font-weight:800;text-decoration:none;white-space:nowrap;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.tb:hover{background:#fff}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.tb-title{flex:1;text-align:center;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:14px;color:#fff;text-shadow:0 2px 0 var(--shadow)}
.short{display:none}
a:focus-visible,button:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px var(--ink)}
@media (max-width:560px){.long{display:none}.short{display:inline}.tb-title{display:none}.topbar{justify-content:space-between}}
/* screens */
#stage{position:relative;z-index:2;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.show{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;border:3px solid var(--ink);border-radius:999px;background:var(--gold);color:var(--ink);font-size:1.2rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 var(--gold-d)}
.btn.alt{background:var(--teal);box-shadow:0 6px 0 var(--teal-d)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold-d)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
/* title */
#scrTitle{justify-content:center;gap:14px;padding:6px 14px 96px;overflow-x:hidden;overflow-y:auto}
#scrTitle>*{position:relative;z-index:2}
#scrTitle>.deco{position:absolute;z-index:1;pointer-events:none}
.logo{font-weight:900;line-height:.98;text-align:center;font-size:clamp(2.6rem,10.5vw,4.6rem);letter-spacing:.02em}
.logo .ln{display:block}
.logo i{font-style:normal;display:inline-block;-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink)}
.sub{font-weight:800;color:#fff;text-shadow:0 2px 0 var(--shadow);text-align:center;max-width:30em;font-size:1.05rem}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:940px}
.mode{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1 1 210px;max-width:290px;min-height:150px;padding:14px 14px 16px;border:3px solid var(--ink);border-radius:26px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:center;box-shadow:0 7px 0 var(--shadow)}
.mode:hover{transform:translateY(-2px)}
.mode:active{transform:translateY(4px);box-shadow:0 3px 0 var(--shadow)}
.mode .ico{display:flex;align-items:center;justify-content:center;gap:4px;height:64px}
.mode .ico svg{height:64px;width:auto}
.mode .ico.two svg{height:48px}
.mode b{display:block;font-size:1.25rem}
.mode small{display:block;margin-top:2px;font-size:.9rem;line-height:1.25;color:var(--ink2);font-weight:700}
.pico{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;background:#e9f9ff;border:3px solid var(--ink);font-size:32px;line-height:1;font-family:var(--emoji)}
.range{display:flex;align-items:center;gap:10px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--shadow)}
.seg{display:inline-flex;background:rgba(255,255,255,.72);border-radius:999px;padding:4px;border:3px solid var(--ink)}
.seg button{min-height:48px;min-width:68px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-size:1.05rem;font-weight:900;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);box-shadow:inset 0 0 0 3px var(--ink)}
.starline{display:flex;align-items:center;gap:6px;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--shadow)}
.deco svg{display:block;width:100%;height:auto}
#decoTurtle{width:clamp(64px,9vw,110px);top:12%;left:-140px;animation:crossT 40s linear infinite}
#decoFish1{width:clamp(60px,8vw,100px);top:30%;left:-130px;animation:crossR 28s linear infinite}
#decoFish2{width:clamp(50px,6.5vw,84px);top:58%;right:-120px;animation:crossL 34s linear infinite}
#decoOcto{width:clamp(110px,15vw,190px);left:2%;bottom:2%}
@keyframes crossT{from{transform:translateX(0) rotate(90deg)}to{transform:translateX(calc(100vw + 300px)) rotate(90deg)}}
@keyframes crossR{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 280px))}}
@keyframes crossL{from{transform:translateX(0) scaleX(-1)}to{transform:translateX(calc(-100vw - 260px)) scaleX(-1)}}
@media (max-width:700px){#scrTitle{padding-bottom:18px}#decoOcto{display:none}}
@media (max-width:640px){
  .mode{flex:1 1 100%;max-width:440px;min-height:84px;flex-direction:row;text-align:left;padding:8px 14px;gap:12px}
  .mode .ico{flex:0 0 88px;height:56px}
  .mode .ico svg{height:52px}
  .mode .ico.two svg{height:36px}
  .mode b{font-size:1.1rem}
  .mode small{font-size:.82rem}
  .pico{width:54px;height:54px;font-size:28px}
}
/* play */
#scrPlay{padding:0 0 8px;gap:8px}
#hud{width:100%;max-width:760px;padding:0 10px;display:flex;flex-direction:column;gap:8px}
#promptBox{display:flex;align-items:center;gap:10px;min-height:76px;padding:6px 10px 6px 8px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--shadow)}
#helper{flex:0 0 58px;width:58px;height:58px}
#helper svg{display:block;width:100%;height:100%}
#helper.cheer svg{animation:hop .7s ease-out}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-9px) rotate(-5deg)}70%{transform:translateY(0) rotate(4deg)}}
#promptTxt{flex:1;min-width:0}
#promptMain{font-weight:900;font-size:clamp(1.05rem,3.8vw,1.55rem);line-height:1.15}
#promptSub{font-weight:700;font-size:clamp(.88rem,2.7vw,1.02rem);color:var(--ink2);line-height:1.2;margin-top:2px;min-height:1.2em}
#promptSub.bad{color:var(--coral-d)}
.gl2{font-family:var(--glyph);font-weight:700;font-size:1.3em;color:var(--coral-d)}
.spk{flex:0 0 48px;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--gold-d)}
.spk:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
.spk svg{width:26px;height:26px}
#hudRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
#pips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;flex:1}
.pip{display:block;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.75);border:2.5px solid var(--ink)}
.pip.on{background:var(--gold)}
#starBox{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:900;font-size:1.3rem;box-shadow:0 4px 0 var(--shadow)}
#starBox svg{width:26px;height:26px}
#starBox.bump{animation:hop .5s ease-out}
.board{width:calc(100% - 16px);max-width:1060px;flex:1;min-height:0;position:relative}
#field{overflow:hidden;border-radius:22px;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.62)}
.bubble{position:absolute;left:0;top:0;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;will-change:transform}
.bubble .orb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.58);border:3px solid var(--ink);font-family:var(--glyph);font-weight:700;color:var(--ink);font-size:calc(var(--D) * .5);line-height:1;box-shadow:inset 0 -8px 0 rgba(63,169,214,.2)}
.bubble .orb::before{content:'';position:absolute;left:15%;top:11%;width:27%;height:14%;border-radius:50%;background:#fff;transform:rotate(-32deg)}
.bubble.born .orb{animation:born .45s ease-out}
@keyframes born{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.bubble.popped{pointer-events:none;opacity:0}
.bubble.popped .orb{animation:popout .4s ease-out}
@keyframes popout{0%{transform:scale(1);opacity:1}40%{transform:scale(1.22);opacity:1}100%{transform:scale(1.5);opacity:0}}
.wob{animation:wob .8s ease-in-out}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) translateX(-3px)}50%{transform:rotate(8deg) translateX(3px)}80%{transform:rotate(-5deg)}}
.bubble.hint .orb{background:rgba(255,246,196,.92);animation:ring 1.7s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 0 0 11px rgba(255,200,61,.9)}}
.drop{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--ink);pointer-events:none}
.flystar{position:fixed;z-index:30;width:40px;height:40px;pointer-events:none}
.flystar svg{width:100%;height:100%}
/* match */
#matchBoard{display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;padding:4px 2px}
.zone h3{font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 var(--shadow);text-align:center;margin-bottom:4px}
.grid{display:grid;justify-content:center;gap:8px 10px}
.item{position:relative;display:block;width:100%;padding:0;border:0;border-radius:20px;background:transparent;cursor:pointer}
.item svg{display:block;width:100%;height:auto;overflow:visible}
.item:hover{transform:translateY(-2px)}
.item.sel{transform:scale(1.07);box-shadow:0 0 0 6px var(--gold),0 0 0 9px var(--ink)}
.item.done{opacity:.6;cursor:default;transform:none}
.item .badge{position:absolute;right:-4px;top:-6px;width:32px;height:32px}
.item .badge svg{width:100%;height:100%}
/* first sound */
#soundBoard{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px;padding:4px}
#porthole{position:relative;width:clamp(150px,31vh,236px);aspect-ratio:1;border-radius:50%;background:#eefaff;border:7px solid #d99a3c;box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--ink),0 7px 0 var(--shadow);display:flex;align-items:center;justify-content:center}
#pic{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
#pic.emoji{font-family:var(--emoji);font-size:clamp(76px,16vh,124px);line-height:1}
#pic.art svg{width:74%;height:74%}
#wordLabel{font-family:var(--glyph);font-weight:700;font-size:1.5rem;letter-spacing:.05em;min-width:140px;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 20px;box-shadow:0 4px 0 var(--shadow)}
#wordLabel b{color:var(--coral-d);font-size:1.15em}
#choices{display:flex;gap:14px;justify-content:center}
.choice{display:flex;align-items:center;justify-content:center;gap:4px;min-width:96px;min-height:92px;padding:6px 14px;border:3px solid var(--ink);border-radius:26px;background:var(--paper);color:var(--ink);font-family:var(--glyph);font-weight:700;cursor:pointer;box-shadow:0 7px 0 var(--shadow);line-height:1.15}
.choice .u{font-size:2.9rem}
.choice .l{font-size:1.9rem;color:var(--ink2)}
.choice:active{transform:translateY(4px);box-shadow:0 3px 0 var(--shadow)}
.choice.right{background:#c9f4d9;box-shadow:0 7px 0 var(--green)}
.choice.dim{opacity:.45}
.choice.no{opacity:.4;cursor:default;box-shadow:none}
.choice.hint,.item.hint{animation:ring 1.7s ease-in-out infinite}
/* done */
#scrDone{justify-content:center;gap:12px;padding:8px 16px 20px;text-align:center;overflow-y:auto}
#scrDone h2{font-size:clamp(2rem,8vw,3.2rem);font-weight:900;color:#fff;text-shadow:0 .06em 0 var(--shadow)}
#doneText{font-size:1.2rem;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--shadow)}
#doneHero{width:100%;max-width:520px;display:flex;align-items:flex-end;justify-content:center;gap:12px;height:clamp(110px,24vh,190px)}
#doneHero svg{height:100%;width:auto;min-width:0;max-width:31%;animation:hop 1.8s ease-in-out infinite}
#doneHero svg:nth-child(2){animation-delay:-.6s}
#doneHero svg:nth-child(3){animation-delay:-1.2s}
#doneStars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:470px}
#doneStars svg{width:34px;height:34px}
@media (max-height:520px){#helper{display:none}#promptBox{min-height:60px}#pips{display:none}#porthole{width:120px}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .wob{outline:5px solid var(--coral);outline-offset:3px}
  .bubble.hint .orb,.choice.hint,.item.hint{box-shadow:0 0 0 9px rgba(255,200,61,.95)}
  #decoTurtle{left:auto;right:6%;top:16%;transform:rotate(90deg)}
  #decoFish1{left:6%;top:26%}
  #decoFish2{right:20%;top:62%;transform:scaleX(-1)}
}
</style>
</head>
<body>
<div id="scene" aria-hidden="true">
  <svg id="sea" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
    <rect width="100" height="42" fill="#8fdcf2"/>
    <rect y="42" width="100" height="30" fill="#6ccdea"/>
    <rect y="72" width="100" height="28" fill="#4db6dd"/>
    <g fill="#fff">
      <polygon opacity=".16" points="6,0 17,0 38,100 16,100"/>
      <polygon opacity=".11" points="28,0 34,0 54,100 43,100"/>
      <polygon opacity=".15" points="49,0 61,0 77,100 51,100"/>
      <polygon opacity=".11" points="71,0 77,0 95,100 85,100"/>
      <polygon opacity=".13" points="88,0 98,0 112,100 94,100"/>
    </g>
  </svg>
  <svg id="floor" viewBox="0 0 100 20" preserveAspectRatio="none" focusable="false">
    <path d="M0,9 C14,3 30,5 46,8 S82,11 100,6 L100,20 L0,20 Z" fill="#e8c47e"/>
    <path d="M0,14 C20,10 40,13 60,12 S90,9 100,13 L100,20 L0,20 Z" fill="#f5dfa6"/>
  </svg>
  <svg id="plantL" class="plant" viewBox="0 0 170 230" focusable="false"></svg>
  <svg id="plantR" class="plant" viewBox="0 0 170 230" focusable="false"></svg>
</div>
<header class="topbar">
  <a class="tb" id="lnkBack" href="index.html" aria-label="Back to the arcade"><span aria-hidden="true">&larr;</span> <span class="long">Back to the arcade</span><span class="short">Arcade</span></a>
  <div class="tb-title">Letter Lagoon</div>
  <button class="tb" id="btnSound" type="button" aria-pressed="true">Sound: On</button>
</header>
<main id="stage">
  <section class="screen show" id="scrTitle" aria-label="Menu">
    <div class="deco" id="decoTurtle"></div>
    <div class="deco" id="decoFish1"></div>
    <div class="deco" id="decoFish2"></div>
    <div class="deco" id="decoOcto"></div>
    <h1 class="logo" id="logo" aria-label="Letter Lagoon"></h1>
    <p class="sub">Pop bubbles, match shells and find first sounds.</p>
    <div class="modes">
      <button class="mode" id="btnPop" data-mode="pop" type="button" data-primary><span class="ico" id="icoPop"></span><span class="txt"><b>Pop the Letter</b><small>Find the letter in the floating bubbles</small></span></button>
      <button class="mode" id="btnMatch" data-mode="match" type="button"><span class="ico two" id="icoMatch"></span><span class="txt"><b>Match Pairs</b><small>Big letters on fish, little letters on shells</small></span></button>
      <button class="mode" id="btnSoundMode" data-mode="sound" type="button"><span class="ico" id="icoSound"></span><span class="txt"><b>First Sound</b><small>Which letter does the picture start with?</small></span></button>
    </div>
    <div class="range"><span>Letters</span><div class="seg" id="segRange" role="group" aria-label="Letters to practice"><button type="button" data-v="A-F">A-F</button><button type="button" data-v="A-M">A-M</button><button type="button" data-v="A-Z">A-Z</button></div></div>
    <div class="starline" id="starLine"></div>
  </section>
  <section class="screen" id="scrPlay" aria-label="Game">
    <div id="hud">
      <div id="promptBox">
        <div id="helper" aria-hidden="true"></div>
        <div id="promptTxt"><div id="promptMain" aria-live="polite"></div><div id="promptSub"></div></div>
        <button class="spk" id="btnSpeak" type="button" aria-label="Hear it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5-4.2v14.4l-5-4.2h-4z" fill="#143d5c"/><path d="M15.5 9c1.8 1.4 1.8 4.6 0 6M18.2 6.3c3.6 3.2 3.6 8.2 0 11.4" fill="none" stroke="#143d5c" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div id="hudRow">
        <button class="tb" id="btnMenu" type="button">Menu</button>
        <div id="pips" aria-hidden="true"></div>
        <div id="starBox" aria-label="Stars this game"><span id="starIco"></span><span id="starNum">0</span></div>
      </div>
    </div>
    <div class="board" id="field"></div>
    <div class="board hidden" id="matchBoard">
      <div class="zone"><h3>Big letters</h3><div class="grid" id="fishGrid"></div></div>
      <div class="zone"><h3>Little letters</h3><div class="grid" id="shellGrid"></div></div>
    </div>
    <div class="board hidden" id="soundBoard">
      <div id="porthole"><div id="pic"></div></div>
      <div id="wordLabel"></div>
      <div id="choices"></div>
    </div>
  </section>
  <section class="screen" id="scrDone" aria-label="Well done">
    <div id="doneHero" aria-hidden="true"></div>
    <h2 id="doneTitle">Great job!</h2>
    <p id="doneText"></p>
    <div id="doneStars" aria-hidden="true"></div>
    <div class="row"><button class="btn" id="btnAgain" type="button" data-primary>Play again</button><button class="btn alt" id="btnHome" type="button">Pick a game</button></div>
  </section>
</main>
<noscript><p style="position:fixed;inset:auto 0 0 0;padding:12px;background:#fff;text-align:center">Letter Lagoon needs JavaScript to run.</p></noscript>
<script>const LL = (() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ac = null, muted = false;
  try { muted = localStorage.getItem('ll.muted') === '1'; } catch (e) {}

function loadData() {
  const d = { stars: {}, range: 'A-F', played: 0 };
  const raw = LL.save.get(SAVE_KEY, null);
  if (raw && typeof raw === 'object') {
    if (RANGE_END[raw.range]) d.range = raw.range;
    if (raw.stars && typeof raw.stars === 'object') for (const k in raw.stars) { const v = +raw.stars[k]; if (v >= 1 && v <= 3) d.stars[k] = v | 0; }
    d.played = Math.max(0, +raw.played | 0);

  return d;

  $('logo').innerHTML = ['Letter', 'Lagoon'].map(w => '<span class="ln">' + w.split('').map(c => '<i style="color:' + cols[k++ % cols.length] + '">' + c + '</i>').join('') + '</span>').join('');
  $('plantL').innerHTML = plantInner(); $('plantR').innerHTML = plantInner();
  $('decoTurtle').innerHTML = turtleSVG(); $('decoFish1').innerHTML = fishSVG(FISH[0]); $('decoFish2').innerHTML = fishSVG(FISH[2]); $('decoOcto').innerHTML = octopusSVG();
  $('icoPop').innerHTML = bubbleSVG('B');
  $('icoMatch').innerHTML = fishSVG(FISH[1], 'B') + shellSVG(SHELLS[2], 'b');
  $('icoSound').innerHTML = '<span class="pico" aria-hidden="true">\u{1F41D}</span>';
  $('starIco').innerHTML = starSVG(26);
  $('helper').innerHTML = octopusSVG('30 8 140 140');
}
function renderStarLine() {
  const names = { pop: 'Pop', match: 'Match', sound: 'Sound' };
  $('starLine').innerHTML = '<span>Best:</span>' + MODES.map(m => {
    const n = data.stars[m + '-' + data.range] || 0;
    return '<span role="img" aria-label="' + names[m] + ' ' + n + ' of 3 stars" style="display:inline-flex;align-items:center;gap:2px">' + names[m] + ' ' + [1, 2, 3].map(i => starSVG(18, i <= n ? '#ffc83d' : '#e6f0f5')).join('') + '</span>';
  }).join('');
}
function renderRange() {
  document.querySelectorAll('#segRange button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === data.range ? 'true' : 'false'));
}
function renderSound() {
  const b = $('btnSound'); b.textContent = LL.muted ? 'Sound: Off' : 'Sound: On'; b.setAttribute('aria-pressed', LL.muted ? 'false' : 'true');
}

/* ---------- shared play helpers ---------- */
function setPrompt(main, sub, bad) {
  $('promptMain').innerHTML = main; $('promptSub').innerHTML = sub || ''; $('promptSub').classList.toggle('bad', !!bad);
}
function renderPips() {
  $('pips').innerHTML = Array.from({ length: S.total }, (_, i) => '<span class="pip' + (i < S.q ? ' on' : '') + '"></span>').join('');
}
function addStar(fromEl) {
  S.found++; $('starNum').textContent = S.found;
  const sb = $('starBox'); sb.classList.remove('bump'); void sb.offsetWidth; sb.classList.add('bump');
  if (!fromEl || LL.reduceMotion || !fromEl.getBoundingClientRect) return;
  try {
    const a = fromEl.getBoundingClientRect(), b = sb.getBoundingClientRect(), s = document.createElement('div');
    s.className = 'flystar'; s.innerHTML = starSVG(40); s.style.left = (a.left + a.width / 2 - 20) + 'px'; s.style.top = (a.top + a.height / 2 - 20) + 'px';
    document.body.appendChild(s);
    const an = s.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: 'translate(' + (b.left + b.width / 2 - a.left - a.width / 2) + 'px,' + (b.top + b.height / 2 - a.top - a.height / 2) + 'px) scale(.5)' }], { duration: 600, easing: 'ease-in' });
    an.onfinish = () => s.remove(); setTimeout(() => s.remove(), 900);
  } catch (e) {}
}
function cheer() {
  const h = $('helper'); h.classList.remove('cheer'); void h.offsetWidth; h.classList.add('cheer'); LL.sfx.good();
}
function hideBoards() { ['field', 'matchBoard', 'soundBoard'].forEach(i => $(i).classList.add('hidden')); }

function start(mode) {
  S.gen++; stopLoop(); hideBoards();
  Object.assign(S, { mode, q: 0, mistakes: 0, wrongs: 0, found: 0, busy: false, sel: null, bubbles: [], target: null, answer: null });
  S.total = mode === 'match' ? COUNTS[data.range][1] : ROUND;
  $('starNum').textContent = '0';
  show('play');
  LL.ctx();
  if (mode === 'pop') { $('field').classList.remove('hidden'); startPop(); }
  else if (mode === 'match') { $('matchBoard').classList.remove('hidden'); startMatch(); }
  else { $('soundBoard').classList.remove('hidden'); startSound(); }
}

function finish() {
  stopLoop(); S.gen++;
  const stars = S.mistakes === 0 ? 3 : S.mistakes <= 2 ? 2 : 1, key = S.mode + '-' + data.range;
  data.stars[key] = Math.max(data.stars[key] || 0, stars); data.played++; persist();
  LL.sfx.win();
  $('doneHero').innerHTML = octopusSVG() + turtleSVG() + fishSVG(FISH[1]);
  $('doneTitle').textContent = stars === 3 ? 'Perfect!' : stars === 2 ? 'Great job!' : 'Well done!';
  $('doneText').textContent = (S.mode === 'match' ? 'You matched all ' + S.total + ' pairs.' : 'You found ' + S.found + ' letters.') + (stars === 3 ? ' No slips at all!' : ' Every try makes you stronger!');
  $('doneStars').innerHTML = [1, 2, 3].map(i => starSVG(34, i <= stars ? '#ffc83d' : '#e6f0f5')).join('');
  $('doneStars').setAttribute('aria-label', stars + ' of 3 stars');
  show('done');
  LL.say(stars === 3 ? 'Perfect! Three stars!' : 'Great job! You got ' + stars + (stars === 1 ? ' star.' : ' stars.'));
  S.lastStars = stars;
}

/* ---------- mode 1: pop the letter ---------- */
function startPop() {
  S.order = shuffle(pool().slice()).slice(0, ROUND); S.total = S.order.length; nextPop();
}
function nextPop() {
  if (S.q >= S.total) return finish();
  renderPips(); S.busy = false; S.wrongs = 0;
  const T = S.order[S.q], n = Math.min(COUNTS[data.range][0], pool().length), others = shuffle(pool().filter(l => l !== T)).slice(0, n - 1);
  S.target = T;
  const w = wordFor(T);
  setPrompt('Pop the letter <span class="gl2">' + T + '</span>', w && w.e ? T + ' is for ' + w.w + ' ' + w.e : T + (w ? ' is for ' + w.w : ''));
  S.speak = 'Pop the letter ' + T + '. ' + T + (w ? ' is for ' + w.w : '');
  LL.say(S.speak);
  const f = $('field'); f.innerHTML = ''; f.dataset.target = T;
  S.bubbles = shuffle([T].concat(others)).map((g, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'bubble born'; b.dataset.g = g;
    b.setAttribute('aria-label', 'Letter ' + g); b.innerHTML = '<span class="orb">' + g + '</span>';
    b.addEventListener('click', () => popTap(b));
    f.appendChild(b);
    return { el: b, g, slot: i, ph: Math.random() * 6.28, sp: .5 + Math.random() * .4, x: 0, y: 0, ax: 0, ay: 0 };
  });
  layoutBubbles();
  if (!LL.reduceMotion && !S.raf) S.raf = requestAnimationFrame(loop);
}
function layoutBubbles() {
  const f = $('field'), n = S.bubbles.length; if (!n) return;
  const W = f.clientWidth - 6, H = f.clientHeight - 6; let best = null;
  for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c), cw = W / c, ch = H / r, d = Math.min(cw, ch); if (!best || d > best.d) best = { c, r, cw, ch, d }; }
  const D = Math.max(46, Math.min(104, best.d * .74));
  S.bubbles.forEach(b => {
    const col = b.slot % best.c, row = Math.floor(b.slot / best.c);
    b.x = 3 + (col + .5) * best.cw - D / 2; b.y = 3 + (row + .5) * best.ch - D / 2;
    b.ax = Math.max(0, (best.cw - D) / 2 * .8); b.ay = Math.max(0, (best.ch - D) / 2 * .8);
    b.el.style.width = b.el.style.height = D + 'px'; b.el.style.setProperty('--D', D + 'px');
    place(b, 0);
  });
}
function place(b, t) {
  const dx = LL.reduceMotion ? 0 : Math.sin(t * b.sp + b.ph) * b.ax, dy = LL.reduceMotion ? 0 : Math.cos(t * b.sp * .8 + b.ph) * b.ay;
  b.cx = b.x + dx; b.cy = b.y + dy;
  b.el.style.transform = 'translate(' + f1(b.cx) + 'px,' + f1(b.cy) + 'px)';
}
function loop(ms) {
  S.raf = 0; if (S.screen !== 'play' || S.mode !== 'pop') return;
  S.bubbles.forEach(b => place(b, ms / 1000));
  S.raf = requestAnimationFrame(loop);
}
function popTap(el) {
  if (S.busy || S.mode !== 'pop') return;
  const g = el.dataset.g, bb = S.bubbles.find(b => b.el === el);
  if (g === S.target) {
    S.busy = true; LL.sfx.pop(); el.classList.add('popped'); addStar(el); cheer();
    setPrompt(pick(CHEERS), S.target + ' says its sound!');
    const w = wordFor(S.target); LL.say(w ? S.target + ' is for ' + w.w : S.target);
    for (let i = 0; i < 6 && bb; i++) {
      const d = document.createElement('span'); d.className = 'drop'; d.style.left = (bb.cx + el.offsetWidth / 2) + 'px'; d.style.top = (bb.cy + el.offsetHeight / 2) + 'px';
      $('field').appendChild(d);
      try { d.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: 'translate(' + (Math.cos(i * 1.05) * 40) + 'px,' + (Math.sin(i * 1.05) * 40) + 'px)', opacity: 0 }], { duration: 450 }).onfinish = () => d.remove(); } catch (e) {}
      setTimeout(() => d.remove(), 700);
    }
    S.q++; renderPips();
    later(nextPop, 1300);
  } else {
    S.mistakes++; S.wrongs++; LL.sfx.again();
    const o = el.firstChild; o.classList.remove('wob'); void o.offsetWidth; o.classList.add('wob');
    setPrompt('Pop the letter <span class="gl2">' + S.target + '</span>', 'That one is ' + g + '. Look for ' + S.target + '!', true);
    LL.say('That is ' + g + '. Find ' + S.target);
    if (S.wrongs >= 2) { const t = S.bubbles.find(b => b.g === S.target); if (t) t.el.classList.add('hint'); }
  }
}

/* ---------- mode 2: match big and little ---------- */
function startMatch() {
  const n = Math.min(COUNTS[data.range][1], pool().length), L = shuffle(pool().slice()).slice(0, n), R = shuffle(L.slice());
  if (n > 1 && R.every((g, i) => g === L[i])) R.reverse();
  S.total = n; S.pairsLeft = n; S.q = 0; S.sel = null;
  const cols = n <= 4 ? n : Math.ceil(n / 2), tpl = 'repeat(' + cols + ',minmax(0,' + (n <= 4 ? 112 : 104) + 'px))';
  const mk = (arr, kind) => arr.map((g, i) => {
    const c = kind === 'fish' ? FISH[i % FISH.length] : SHELLS[i % SHELLS.length];
    return '<button type="button" class="item ' + kind + '" data-g="' + g + '" data-kind="' + kind + '" aria-label="' + (kind === 'fish' ? 'Big letter ' + g : 'Little letter ' + g.toLowerCase()) + '">' + (kind === 'fish' ? fishSVG(c, g) : shellSVG(c, g.toLowerCase())) + '</button>';
  }).join('');
  $('fishGrid').style.gridTemplateColumns = tpl; $('shellGrid').style.gridTemplateColumns = tpl;
  $('fishGrid').innerHTML = mk(L, 'fish'); $('shellGrid').innerHTML = mk(R, 'shell');
  document.querySelectorAll('#matchBoard .item').forEach(b => b.addEventListener('click', () => matchTap(b)));
  renderPips();
  setPrompt('Match the big and little letters', 'Tap a fish, then its shell.');
  S.speak = 'Match each big letter fish with its little letter shell.'; LL.say(S.speak);
}
function clearSel() { if (S.sel) S.sel.classList.remove('sel'); S.sel = null; }
function matchTap(el) {
  if (el.classList.contains('done') || S.busy) return;
  LL.sfx.tap();
  if (!S.sel) { S.sel = el; el.classList.add('sel'); return; }
  if (S.sel === el) { clearSel(); return; }
  if (S.sel.dataset.kind === el.dataset.kind) { clearSel(); S.sel = el; el.classList.add('sel'); return; }
  const a = S.sel;
  if (a.dataset.g === el.dataset.g) {
    clearSel();
    [a, el].forEach(x => { x.classList.add('done'); x.classList.remove('hint'); x.insertAdjacentHTML('beforeend', '<span class="badge">' + starSVG(32) + '</span>'); x.setAttribute('aria-disabled', 'true'); });
    addStar(el); cheer(); S.q++; S.pairsLeft--; S.wrongs = 0; renderPips();
    setPrompt(pick(CHEERS), el.dataset.g + ' and ' + el.dataset.g.toLowerCase() + ' are a pair!'); LL.say(el.dataset.g + ' and ' + el.dataset.g.toLowerCase());
    if (S.pairsLeft <= 0) { S.busy = true; later(finish, 1200); }
  } else {
    S.mistakes++; S.wrongs++; LL.sfx.again(); clearSel();
    [a, el].forEach(x => { x.classList.remove('wob'); void x.offsetWidth; x.classList.add('wob'); });
    setPrompt('Match the big and little letters', 'Not a pair. Try another!', true);
    if (S.wrongs >= 2) {
      const want = a.dataset.kind === 'fish' ? 'shell' : 'fish';
      const t = document.querySelector('#matchBoard .item.' + want + '[data-g="' + a.dataset.g + '"]'); if (t) t.classList.add('hint');
      a.classList.add('hint');
    }
  }
}

/* ---------- mode 3: first sound ---------- */
function startSound() {
  const letters = shuffle(pool().slice()).slice(0, ROUND);
  S.pics = letters.map(L => pick(PICS.filter(p => p.L === L))); S.total = S.pics.length; nextSound();
}
function nextSound() {
  if (S.q >= S.total) return finish();
  renderPips(); S.busy = false; S.wrongs = 0;
  const p = S.pics[S.q], T = p.L; S.target = T; S.answer = T;
  const pic = $('pic'); pic.className = p.art ? 'art' : 'emoji'; pic.innerHTML = ''; if (p.art) pic.innerHTML = ART[p.art](); else pic.textContent = p.e;
  pic.setAttribute('role', 'img'); pic.setAttribute('aria-label', p.w);
  $('wordLabel').innerHTML = '<b>_</b>' + p.w.slice(1);
  const ban = [T].concat(SOUNDALIKE[T] || []), opts = shuffle(pool().filter(l => ban.indexOf(l) < 0)).slice(0, 2).concat([T]);
  shuffle(opts);
  $('choices').innerHTML = opts.map(g => '<button type="button" class="choice" data-g="' + g + '" aria-label="Letter ' + g + '"><span class="u">' + g + '</span><span class="l">' + g.toLowerCase() + '</span></button>').join('');
  $('choices').querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => soundTap(b, p)));
  setPrompt('What does <span class="gl2">' + p.w + '</span> start with?', 'Tap the first letter.');
  S.speak = p.w + '. What letter does ' + p.w + ' start with?'; LL.say(S.speak);
}
function soundTap(el, p) {
  if (S.busy || el.classList.contains('no') || S.mode !== 'sound') return;
  const g = el.dataset.g;
  if (g === S.answer) {
    S.busy = true; el.classList.add('right'); document.querySelectorAll('#choices .choice').forEach(c => { if (c !== el) c.classList.add('dim'); c.classList.remove('hint'); });
    $('wordLabel').innerHTML = '<b>' + p.w[0] + '</b>' + p.w.slice(1);
    addStar(el); cheer(); setPrompt(pick(CHEERS), p.w + ' starts with ' + g + '!'); LL.say(p.w + ' starts with ' + g);
    S.q++; renderPips(); later(nextSound, 1500);
  } else {
    S.mistakes++; S.wrongs++; LL.sfx.again(); el.classList.add('no'); el.setAttribute('aria-disabled', 'true');
    setPrompt('What does <span class="gl2">' + p.w + '</span> start with?', 'Not ' + g + '. Say it slowly: ' + p.w + '!', true); LL.say('Not ' + g + '. Try again. ' + p.w);
    if (S.wrongs >= 2) { const r = $('choices').querySelector('[data-g="' + S.answer + '"]'); if (r) r.classList.add('hint'); }
  }
}

/* ---------- wiring ---------- */
function wire() {
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => start(b.dataset.mode)));
  document.querySelectorAll('#segRange button').forEach(b => b.addEventListener('click', () => { data.range = b.dataset.v; persist(); renderRange(); renderStarLine(); LL.sfx.tap(); }));
  $('btnSound').addEventListener('click', () => { LL.setMuted(!LL.muted); renderSound(); if (!LL.muted) LL.sfx.tap(); });
  $('btnMenu').addEventListener('click', toTitle);
  $('btnHome').addEventListener('click', toTitle);
  $('btnAgain').addEventListener('click', () => start(S.mode));
  $('btnSpeak').addEventListener('click', () => { if (S.speak) LL.say(S.speak); else LL.sfx.tap(); });
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.screen === 'play' && S.mode === 'pop') layoutBubbles(); }, 80); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && S.screen !== 'title') toTitle(); });
}
buildTitle(); renderRange(); renderSound(); renderStarLine(); wire();
if (/[?&]debug/.test(location.search)) window.__ll = { S, data };
