<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fraction Pizza</title>
<meta name="description" content="Run a pizzeria and learn fractions: serve slices, compare pizzas, match equal fractions and add slices of the same size.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23f2dfb9%22/%3E%3Ccircle cx=%2250%22 cy=%2252%22 r=%2240%22 fill=%22%23efb25a%22 stroke=%22%235b2a12%22 stroke-width=%225%22/%3E%3Ccircle cx=%2250%22 cy=%2252%22 r=%2230%22 fill=%22%23d9402b%22/%3E%3Ccircle cx=%2250%22 cy=%2252%22 r=%2225%22 fill=%22%23ffd45c%22/%3E%3Ccircle cx=%2241%22 cy=%2244%22 r=%227%22 fill=%22%23c9372f%22/%3E%3Ccircle cx=%2260%22 cy=%2256%22 r=%227%22 fill=%22%23c9372f%22/%3E%3C/svg%3E">
<style>
:root{--ink:#3a1d0d;--muted:#765743;--cream:#fff6e4;--paper:#fffdf7;--tomato:#c8362b;--tomato-d:#8e2118;--basil:#2a7a39;--basil-d:#1b5427;--cheese:#ffd45c;--line:#5b2a12;--focus:#1a5fd0}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--ink);font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;line-height:1.35;background-color:var(--cream);background-image:conic-gradient(#ffecd2 25%,transparent 0 50%,#ffecd2 0 75%,transparent 0);background-size:56px 56px}
button{font:inherit;color:inherit;touch-action:manipulation}
figure{margin:0}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:60px;background:var(--tomato);border-bottom:4px solid var(--tomato-d)}
.tb{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:0 16px;border:0;border-radius:999px;background:var(--cream);color:var(--tomato-d);font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--tomato-d)}
.tb:hover{background:#fff}
.tb-title{flex:1;text-align:center;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--cream)}
main{max-width:980px;margin:0 auto;padding:14px 14px 48px}
.card{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 rgba(91,42,18,.28)}
.logo{font-size:clamp(2rem,7vw,3.4rem);font-weight:900;line-height:1;letter-spacing:.02em;color:var(--tomato);text-shadow:0 .06em 0 var(--tomato-d),0 .12em 0 rgba(91,42,18,.25)}
.logo span{color:var(--basil);text-shadow:0 .06em 0 var(--basil-d),0 .12em 0 rgba(91,42,18,.25)}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.heroArt{width:clamp(130px,26vw,190px);flex:none}
.heroTxt{flex:1 1 260px;min-width:0}
.lede{margin-top:.8rem;font-size:1.05rem;color:var(--muted)}
.tally{margin-top:.6rem;font-weight:800;color:var(--basil-d)}
.h2{margin:20px 2px 8px;font-size:1.1rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--tomato-d)}
.modes,.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.modeBtn,.lvlBtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:88px;padding:10px 14px;border:3px solid var(--line);border-radius:16px;background:var(--paper);cursor:pointer;text-align:left;box-shadow:0 5px 0 var(--line)}
.modeBtn b,.lvlBtn b{font-size:1.1rem}
.modeBtn small,.lvlBtn small{color:var(--muted);font-size:.92rem}
.modeBtn[aria-pressed="true"]{background:var(--cheese)}
.modeBtn:hover,.lvlBtn:hover{background:#fff1c9}
.modeBtn[aria-pressed="true"]:hover{background:var(--cheese)}
.modeBtn:active,.lvlBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.starsRow{display:inline-flex;gap:2px}
.starsRow svg{width:24px;height:24px}
.progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qcount{font-weight:800}
.pips{display:flex;gap:6px;flex:1;min-width:120px}
.pip{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:#fff}
.pip.now{background:var(--cheese);transform:scale(1.2)}
.pip.clean{background:var(--basil)}
.pip.helped{background:#8bb5d9}
.chip{min-height:48px;padding:0 16px;border:3px solid var(--line);border-radius:999px;background:var(--paper);font-weight:800;cursor:pointer}
.promptCard{display:flex;align-items:center;gap:14px}
.face{flex:none;width:clamp(64px,16vw,96px)}
.face svg{display:block;width:100%;height:auto}
.promptBody{flex:1;min-width:0;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
#prompt{flex:1 1 300px;font-size:clamp(1.05rem,2.8vw,1.35rem);font-weight:700;line-height:1.5}
.hear{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border:3px solid var(--line);border-radius:999px;background:#fff;font-weight:800;cursor:pointer}
.hear svg{width:22px;height:22px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:900;font-family:Verdana,'Trebuchet MS',sans-serif;margin:0 .14em}
.frac .n{padding:0 .24em .08em}
.frac .d{padding:.08em .24em 0;border-top:.12em solid currentColor}
.frac.in{font-size:1.15em}
.frac.cap{font-size:1.7rem}
.area{margin-top:14px}
.plates{display:flex;gap:clamp(8px,3vw,28px);justify-content:center;align-items:flex-start}
.pzWrap{width:clamp(120px,40vw,270px);text-align:center}
.pzWrap figcaption{margin:6px 0;font-weight:800}
.plates .pzWrap{width:clamp(120px,38vw,230px)}
.plates .pzWrap figcaption{min-height:2.9em;display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 6px}
.cmpRow{display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,22px);flex-wrap:wrap}
.cmpRow .pzWrap{width:clamp(104px,27vw,220px)}
.pz{display:block;width:100%;height:auto;overflow:visible}
.pz .slice{outline:none}
.pz.interactive .slice[data-on="1"]{cursor:pointer}
.pz.interactive .slice[data-on="0"]{pointer-events:none}
.pz.interactive .slice[data-on="1"]:hover .art{filter:brightness(1.08)}
.pz.interactive .slice:focus-visible .crust{stroke:var(--focus);stroke-width:6}
.slice[data-on="0"] .art{display:none}
.slice[data-on="1"] .ghost{display:none}
@keyframes pop{from{transform:scale(.55);opacity:.4}to{transform:scale(1);opacity:1}}
.slice.pop .art{animation:pop .22s ease-out;transform-origin:0 0}
.op{font-size:2.4rem;font-weight:900;color:var(--tomato-d);min-width:28px;text-align:center}
.signSlot{min-width:68px;height:68px;display:grid;place-items:center;font-size:2.6rem;font-weight:900;border:4px dashed var(--line);border-radius:50%;background:var(--paper)}
.signSlot.set{border-style:solid;background:var(--cheese)}
.mystery{width:clamp(104px,27vw,220px);aspect-ratio:1;display:grid;place-items:center;border:4px dashed var(--line);border-radius:50%;font-size:3rem;font-weight:900;color:var(--muted);background:var(--paper)}
.mystery.filled{border:0;aspect-ratio:auto;background:none;border-radius:0;display:block}
.mystery.txt figcaption{font-size:1.1rem;line-height:1.25;max-width:9em;margin-inline:auto}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.opt{position:relative;min-width:108px;min-height:96px;padding:12px 20px;border:3px solid var(--line);border-radius:16px;background:var(--paper);font-size:1.9rem;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.opt:hover:not(:disabled){background:#fff1c9}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt:disabled{cursor:default}
.opt.off{opacity:.45}
.opt.ok{background:#bfe8bd;border-color:var(--basil)}
.opt .key{position:absolute;left:9px;top:4px;font-size:.72rem;font-weight:800;color:var(--muted)}
.opt.sign{font-size:2.6rem;line-height:1;min-width:128px}
.opt.sign small{display:block;margin-top:4px;font-size:.78rem;font-weight:800;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border:3px solid transparent;border-radius:999px;background:var(--basil);color:#fff;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 var(--basil-d)}
.btn.alt{background:var(--tomato);box-shadow:0 5px 0 var(--tomato-d)}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn:disabled{opacity:.45;cursor:default}
.ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.serveCtrl{display:grid;grid-template-columns:1fr 1fr;max-width:520px;margin-left:auto;margin-right:auto}
.serveCtrl #btnTake{order:1}.serveCtrl #btnPut{order:2}.serveCtrl #btnServe{order:3;grid-column:1/-1}
@media (min-width:640px){.serveCtrl{grid-template-columns:auto auto auto;max-width:none;justify-content:center}.serveCtrl #btnTake{order:1}.serveCtrl #btnServe{order:2;grid-column:auto}.serveCtrl #btnPut{order:3}}
.feedback{margin-top:14px;padding:10px 14px;border-radius:14px;font-weight:700;font-size:1.05rem}
.feedback:empty{display:none}
.feedback.good{background:#dff3dc;border:3px solid var(--basil)}
.feedback.hint{background:#fff0c4;border:3px solid #b07a00}
.hintRow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hintRow .mini{width:clamp(96px,26vw,140px);flex:none}
.hintRow .mini figcaption{text-align:center;font-size:.9rem;margin-top:2px}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 16px}
.result h2{font-size:clamp(1.6rem,5vw,2.3rem);color:var(--tomato-d)}
.result .starsRow svg{width:clamp(48px,14vw,72px);height:clamp(48px,14vw,72px)}
.result .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.tiny{font-size:.9rem;color:var(--muted)}
@media (max-width:520px){.tb-title{display:none}.topbar{justify-content:space-between}.card{padding:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="tb" href="index.html">&larr; Back to the arcade</a>
  <div class="tb-title">Fraction Pizza</div>
  <button class="tb" id="btnSound" type="button">Sound: On</button>
</header>
<main>
  <section id="scrHome">
    <div class="card hero">
      <div class="heroArt" id="heroArt"></div>
      <div class="heroTxt">
        <h1 class="logo">FRACTION <span>PIZZA</span></h1>
        <p class="lede">Welcome to the pizzeria! Serve slices, compare pizzas, match equal fractions and add slices up. Each round has 8 questions, and a wrong answer just gets a hint.</p>
        <p class="tally" id="tally"></p>
      </div>
    </div>
    <h2 class="h2">1. Pick a game</h2>
    <div class="modes" id="modes" role="group" aria-label="Pick a game"></div>
    <h2 class="h2">2. Pick a level to start</h2>
    <div class="levels" id="levels" role="group" aria-label="Pick a level"></div>
  </section>

  <section id="scrPlay" hidden>
    <div class="progress">
      <button class="chip" id="btnMenu" type="button">&larr; Menu</button>
      <div class="qcount" id="qcount" aria-live="polite"></div>
      <div class="pips" id="pips" aria-hidden="true"></div>
    </div>
    <div class="card promptCard">
      <div class="face" id="face" aria-hidden="true"></div>
      <div class="promptBody">
        <div id="prompt"></div>
        <button class="hear" id="btnHear" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="#3a1d0d"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#3a1d0d" stroke-width="2" stroke-linecap="round"/></svg>Hear it again</button>
      </div>

  <section id="scrResult" class="card result" hidden>
    <div class="face" id="resFace" aria-hidden="true"></div>
    <h2 id="resTitle" tabindex="-1">Round complete!</h2>
    <div id="resStars"></div>
    <p id="resText"></p>
    <p class="tiny" id="resBest"></p>
    <div class="row">
      <button class="btn" id="btnAgain" type="button">Play again</button>

      <button class="btn ghost" id="btnHome" type="button">Menu</button>
    </div>
  </section>
</main>
<noscript><p style="padding:2em">Fraction Pizza needs JavaScript turned on.</p></noscript>
<script>
(() => {
'use strict';
// ===== Learning Arcade kit (shared feel across the Little Learners games) =====
const LL = (() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ac = null, muted = false;
  try { muted = localStorage.getItem('ll.muted') === '1'; } catch (e) {}
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(freq, dur = .12, type = 'sine', vol = .15, when = 0) {
    if (muted) return; const a = ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
    const t = a.currentTime + when; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    tap() { tone(520, .07, 'triangle', .12); },
    good() { [523, 659, 784].forEach((f, i) => tone(f, .16, 'sine', .14, i * .09)); },
    again() { tone(330, .12, 'triangle', .1); tone(294, .16, 'triangle', .1, .1); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'sine', .15, i * .11)); },
    pop() { tone(700, .05, 'square', .06); tone(980, .07, 'sine', .08, .03); },
  };
  function say(text, opts = {}) {
    if (muted || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.rate = opts.rate || .9; u.pitch = opts.pitch || 1.1; u.lang = 'en-US';
      const vs = speechSynthesis.getVoices();
      const v = vs.find(v => /en[-_]US/i.test(v.lang) && /(Zira|Aria|Jenny|Samantha|Google US)/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang));
      if (v) u.voice = v; speechSynthesis.speak(u);
    } catch (e) {}
  }
  const save = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  function setMuted(m) { muted = m; try { localStorage.setItem('ll.muted', m ? '1' : '0'); } catch (e) {} if (m && 'speechSynthesis' in window) speechSynthesis.cancel(); }
  return { reduceMotion, sfx, say, save, get muted() { return muted; }, setMuted, ctx };
})();

// ===== helpers =====
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const OUT = '#5b2a12';
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const reduce = f => { const g = gcd(f.n, f.d); return { n: f.n / g, d: f.d / g }; };
const sameVal = (a, b) => a.n * b.d === b.n * a.d;
const sameWritten = (a, b) => a.n === b.n && a.d === b.d;
const proper = f => Number.isInteger(f.n) && Number.isInteger(f.d) && f.d >= 2 && f.n >= 1 && f.n < f.d;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen'];
const DENW = { 2: ['half', 'halves'], 3: ['third', 'thirds'], 4: ['quarter', 'quarters'], 5: ['fifth', 'fifths'], 6: ['sixth', 'sixths'], 8: ['eighth', 'eighths'], 10: ['tenth', 'tenths'], 12: ['twelfth', 'twelfths'], 16: ['sixteenth', 'sixteenths'] };
function words(f) { const w = DENW[f.d]; return w ? NUMW[f.n] + ' ' + w[f.n === 1 ? 0 : 1] : f.n + ' over ' + f.d; }
function frac(f, cls) { return '<span class="frac' + (cls ? ' ' + cls : '') + '" role="img" aria-label="' + words(f) + '"><span class="n">' + f.n + '</span><span class="d">' + f.d + '</span></span>'; }

// ===== pizza drawing (original art: flat colors, one outline color and width) =====
const pt = (r, deg) => { const t = deg * Math.PI / 180; return [+(r * Math.cos(t)).toFixed(4), +(r * Math.sin(t)).toFixed(4)]; };
// A wedge from the centre, clockwise from angle a0 to a1 (degrees; -90 = straight up).
function wedge(r, a0, a1) {
  const p0 = pt(r, a0), p1 = pt(r, a1);
  return 'M0 0L' + p0[0] + ' ' + p0[1] + 'A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + p1[0] + ' ' + p1[1] + 'Z';
}
function sliceAngles(n) { const s = 360 / n; return Array.from({ length: n }, (_, i) => ({ i, start: -90 + i * s, end: -90 + (i + 1) * s, span: s })); }
function topping(kind, x, y, rot) {
  if (kind === 0) return '<circle cx="' + x + '" cy="' + y + '" r="8.5" fill="#c9372f" stroke="' + OUT + '" stroke-width="2.4"/><circle cx="' + (x - 2.6) + '" cy="' + (y - 2.6) + '" r="2" fill="#ec7b6e"/>';
  if (kind === 1) return '<circle cx="' + x + '" cy="' + y + '" r="6.5" fill="#46512a" stroke="' + OUT + '" stroke-width="2.4"/><circle cx="' + x + '" cy="' + y + '" r="2.3" fill="#d9402b"/>';
  return '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot.toFixed(1) + ')"><ellipse rx="9" ry="5" fill="#52b055" stroke="' + OUT + '" stroke-width="2.4"/><path d="M-6 0H6" stroke="#2c7a34" stroke-width="1.6" stroke-linecap="round"/></g>';
}
function sliceArt(n, i) {
  const s = 360 / n, a0 = -90 + i * s, a1 = a0 + s;
  let g = '<path class="crust" d="' + wedge(90, a0, a1) + '" fill="#efb25a" stroke="' + OUT + '" stroke-width="3" stroke-linejoin="round"/>'
        + '<path d="' + wedge(78, a0, a1) + '" fill="#d9402b"/>'
        + '<path d="' + wedge(70, a0, a1) + '" fill="#ffd45c"/>';
  const k = Math.max(1, Math.round(s / 50));
  for (let j = 0; j < k; j++) {
    const ang = a0 + (j + .5) * s / k, r = j % 2 ? 37 : 53, p = pt(r, ang);
    g += topping((i * 2 + j) % 3, p[0], p[1], ang);
  }
  return g;
}
// on: number k = first k slices shaded | array of indices | function(i). Others are drawn as empty board.
function pizzaSVG(n, on, o) {
  o = o || {};
  const isOn = i => typeof on === 'number' ? i < on : Array.isArray(on) ? on.indexOf(i) >= 0 : !!on(i);
  let s = '<svg class="pz' + (o.interactive ? ' interactive' : '') + '" viewBox="-104 -104 208 208" role="img" aria-label="' + (o.label || '') + '"' + (o.id ? ' id="' + o.id + '"' : '') + '>';
  s += '<circle r="100" fill="' + (o.plate ? '#ffffff' : '#f2dfb9') + '" stroke="' + OUT + '" stroke-width="3.5"/>';
  if (o.plate) s += '<circle r="86" fill="none" stroke="#c9d3de" stroke-width="3"/>';
  for (let i = 0; i < n; i++) {
    const lift = o.lift && o.lift[i];
    s += '<g class="slice" data-i="' + i + '" data-on="' + (isOn(i) ? 1 : 0) + '"' + (lift ? ' transform="translate(' + lift[0] + ' ' + lift[1] + ')"' : '') + ' pointer-events="all">'
       + '<g class="art">' + sliceArt(n, i) + '</g>'
       + '<path class="ghost" d="' + wedge(90, -90 + i * 360 / n, -90 + (i + 1) * 360 / n) + '" fill="transparent" stroke="#b99a62" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"/></g>';
  }
  return s + '</svg>';
}

// ===== people (original characters) =====
const PEOPLE = [
  { skin: '#f3c9a0', hair: '#6b3f22', shirt: '#3f87c7' },
  { skin: '#c68a5e', hair: '#2a1a12', shirt: '#e2802f' },
  { skin: '#8d5b3a', hair: '#1d130e', shirt: '#4f9a4a' },

  return false;
}

// -- Same Amount and Add Up share the three-button answer row
function fillMystery(f, cap) { const m = $('#mystery'); m.classList.add('filled'); m.classList.toggle('txt', !!cap); m.innerHTML = figF(f, cap); }
function renderSame(q) {
  state.face = { v: state.qi, chef: true };
  setPrompt('Which fraction covers the same amount of pizza as ' + frac(q.t, 'in') + '? Pick one.', 'Which fraction covers the same amount of pizza as ' + words(q.t) + '? Pick one.');
  $('#area').innerHTML = '<div class="cmpRow">' + figF(q.t) + '<div class="signSlot" id="signSlot">=</div><div class="mystery" id="mystery" aria-live="polite">?</div></div>' + optsHTML(q.opts);
}
function renderAdd(q) {
  state.face = { v: state.qi, chef: true };
  setPrompt('Add the shaded slices: ' + frac(q.a, 'in') + ' + ' + frac(q.b, 'in') + ' = ?  The slices are all the same size.',
    words(q.a) + ' plus ' + words(q.b) + ' equals what? The slices are all the same size, so you can count them together.');
  $('#area').innerHTML = '<div class="cmpRow">' + figF(q.a) + '<div class="op">+</div>' + figF(q.b) + '<div class="op">=</div><div class="mystery" id="mystery" aria-live="polite">?</div></div>' + optsHTML(q.opts);
}
function chooseOpt(i) {
  const q = state.q;
  if (state.answered || (q.mode !== 'same' && q.mode !== 'add') || !q.opts[i]) return false;
  const o = q.opts[i], btn = $('#opts [data-i="' + i + '"]');
  if (o.ok) {
    $$('#opts .opt').forEach(b => { b.disabled = true; }); btn.classList.add('ok');
    if (q.mode === 'same') {
      fillMystery(o);
      onCorrect('Yes! ' + frac(q.t, 'in') + ' and ' + frac(o, 'in') + ' cover the same amount of pizza, even though the slices are cut differently.', 'Yes! ' + words(q.t) + ' and ' + words(o) + ' cover the same amount of pizza.');
    } else {
      fillMystery(q.sum);
      onCorrect('Yes! ' + frac(q.a, 'in') + ' + ' + frac(q.b, 'in') + ' = ' + frac(q.sum, 'in') + '. The slices are the same size, so we count them: ' + q.a.n + ' + ' + q.b.n + ' = ' + q.sum.n + ' slices out of ' + q.sum.d + '.',
        'Yes! ' + words(q.a) + ' plus ' + words(q.b) + ' equals ' + words(q.sum) + '. We count the slices: ' + NUMW[q.a.n] + ' plus ' + NUMW[q.b.n] + ' is ' + NUMW[q.sum.n] + ' slices.');
    }
    return true;
  }
  btn.disabled = true; btn.classList.add('off');
  if (q.mode === 'same') {
    fillMystery(o);
    const more = o.n / o.d > q.t.n / q.t.d;
    onWrong('Not the same. Look at both pizzas: ' + frac(o, 'in') + ' covers ' + (more ? 'more' : 'less') + ' pizza than ' + frac(q.t, 'in') + '. Try another one.',
      'Not the same. ' + words(o) + ' covers ' + (more ? 'more' : 'less') + ' pizza than ' + words(q.t) + '. Try another one.');
  } else {
    fillMystery(q.sum, 'count the shaded slices');
    onWrong('Not quite. The slices are the same size, so count them together: ' + q.a.n + ' slices + ' + q.b.n + ' slices = ' + q.sum.n + ' slices. The pizza is still cut into ' + q.sum.d + ' equal slices. Try again.',
      'Not quite. The slices are the same size, so count them together: ' + NUMW[q.a.n] + ' plus ' + NUMW[q.b.n] + ' is ' + NUMW[q.sum.n] + ' slices. Try again.');
  }
  return false;
}

// ===== a round =====
function startRound(mode, level) {
  state.mode = mode; state.level = level; state.qs = makeRound(mode, level); state.qi = 0; state.clean = 0; state.results = [];
  show('play'); renderQuestion();
  return state.q;
}
function finishRound() {
  const clean = state.clean, stars = clean >= 7 ? 3 : clean >= 5 ? 2 : 1, key = state.mode + '-' + state.level;
  save.stars[key] = Math.max(save.stars[key] || 0, stars);
  save.best[key] = Math.max(save.best[key] || 0, clean);
  save.rounds = (save.rounds || 0) + 1;
  persist();
  state.stars = stars;
  state.face = { v: 1, chef: true };
  show('result');
  $('#resFace').innerHTML = person(1, 'happy', true);
  $('#resTitle').textContent = stars === 3 ? 'Perfect pizza!' : stars === 2 ? 'Great slicing!' : 'Round complete!';
  $('#resStars').innerHTML = starsHTML(stars);
  $('#resText').textContent = 'You got ' + clean + ' of ' + state.qs.length + ' on the first try in ' + MODES[state.mode].name + ', level ' + state.level + '. ' + (stars === 3 ? 'The customers cheer!' : 'Play again for more stars. Hints are always free.');
  $('#resBest').textContent = 'Best here so far: ' + save.best[key] + ' of ' + state.qs.length + ' first try.';
  $('#btnNextLevel').hidden = state.level >= LEVELS.length;
  LL.sfx.win();
  LL.say(stars === 3 ? 'Perfect pizza! Three stars!' : stars === 2 ? 'Great slicing! Two stars!' : 'Round complete! One star. Play again for more.');
  $('#resTitle').focus();
}

// ===== wiring =====
function syncSound() { $('#btnSound').textContent = 'Sound: ' + (LL.muted ? 'Off' : 'On'); }
$('#btnSound').addEventListener('click', () => { LL.setMuted(!LL.muted); syncSound(); if (!LL.muted) LL.sfx.tap(); });
$('#modes').addEventListener('click', e => {
  const b = e.target.closest('.modeBtn'); if (!b) return;
  state.mode = save.mode = b.dataset.mode; persist(); LL.sfx.tap(); renderModes(); renderLevels();
  const nb = $('#modes [data-mode="' + state.mode + '"]'); if (nb) nb.focus({ preventScroll: true });
});
$('#levels').addEventListener('click', e => { const b = e.target.closest('.lvlBtn'); if (b) { LL.sfx.tap(); startRound(state.mode, +b.dataset.level); } });
$('#btnMenu').addEventListener('click', goHome);
$('#btnHome').addEventListener('click', goHome);
$('#btnAgain').addEventListener('click', () => startRound(state.mode, state.level));
$('#btnNextLevel').addEventListener('click', () => startRound(state.mode, Math.min(LEVELS.length, state.level + 1)));
$('#btnNext').addEventListener('click', nextQuestion);
$('#btnHear').addEventListener('click', () => LL.say(state.speech));
$('#area').addEventListener('click', e => {
  const q = state.q; if (!q) return;
  const sl = e.target.closest('.slice');
  if (sl) { if (sl.dataset.on === '1') toggleSlice(+sl.dataset.i, false); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'btnPut') { const i = state.served.indexOf(false); if (i >= 0) toggleSlice(i, false); }
  else if (b.id === 'btnTake') { const i = state.served.lastIndexOf(true); if (i >= 0) toggleSlice(i, false); }
  else if (b.id === 'btnServe') checkServe();
  else if (b.dataset.s) chooseSign(b.dataset.s);
  else if (b.dataset.i !== undefined) chooseOpt(+b.dataset.i);
});
$('#area').addEventListener('keydown', e => {
  const sl = e.target.closest && e.target.closest('.slice');
  if (sl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); if (sl.dataset.on === '1') toggleSlice(+sl.dataset.i, true); }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || state.screen !== 'play' || !state.q || state.answered) return;
  const q = state.q, k = e.key;
  if (q.mode === 'compare') { const m = { '>': '>', '.': '>', '=': '=', '<': '<', ',': '<', '1': '>', '2': '=', '3': '<' }[k]; if (m) { e.preventDefault(); chooseSign(m); } }
  else if ((q.mode === 'same' || q.mode === 'add') && k >= '1' && k <= '3') { e.preventDefault(); chooseOpt(+k - 1); }
});
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => LL.ctx(), { once: true, passive: true }));

// ===== test hook: open fraction-pizza.html?debug =====
function solve() {
  const q = state.q;
  if (!q || state.screen !== 'play' || state.answered) return false;
  if (q.mode === 'serve') { for (let i = 0; i < q.d; i++) if (state.served[i] !== (i < q.n)) toggleSlice(i, false); return checkServe(); }
  if (q.mode === 'compare') return chooseSign(q.ans);
  return chooseOpt(q.opts.findIndex(o => o.ok));
}
function answerWrong() {
  const q = state.q;
  if (!q || state.screen !== 'play' || state.answered) return false;
  if (q.mode === 'serve') { const wrong = q.n === 1 ? 2 : q.n - 1; for (let i = 0; i < q.d; i++) if (state.served[i] !== (i < wrong)) toggleSlice(i, false); checkServe(); return true; }
  if (q.mode === 'compare') { chooseSign(['>', '=', '<'].find(s => s !== q.ans && !$('#signs [data-s="' + s + '"]').disabled)); return true; }
  const i = q.opts.findIndex((o, idx) => !o.ok && !$('#opts [data-i="' + idx + '"]').disabled);
  if (i < 0) return false;
  chooseOpt(i); return true;
}
if (/[?&]debug\b/.test(location.search)) {
  window.__pizza = { get state() { return state; }, start: startRound, solve, answerWrong, next: nextQuestion, sliceAngles, verify, verifyAll, makeRound, pizzaSVG, LEVELS, MODES, get save() { return save; } };
}

renderHome(); show('home'); syncSound();
})();
</script>
